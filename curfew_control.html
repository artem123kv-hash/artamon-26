<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d4af37">
<title>🎛 Управление комендантским часом</title>
<style>
:root {
  --bg-0: #050507;
  --bg-1: #0a0a10;
  --bg-2: #12121a;
  --bg-3: #1a1a24;
  --border: #252532;
  --txt-1: #e8e8f0;
  --txt-2: #8888a0;
  --txt-3: #555568;
  --gold: #d4af37;
  --gold-bright: #f6e6a8;
  --gold-dark: #8f6f1a;
  --red: #f87171;
  --red-dark: #991b1b;
  --green: #4ade80;
  --green-dark: #166534;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100vh;
  background: var(--bg-1);
  color: var(--txt-1);
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  line-height: 1.5;
  padding: 16px;
}
body {
  background-image:
    radial-gradient(circle at 50% 0%, rgba(212,175,55,.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(248,113,113,.05) 0%, transparent 50%);
}

.container {
  max-width: 520px;
  margin: 0 auto;
}

.header {
  text-align: center;
  padding: 20px 16px;
  margin-bottom: 16px;
  background: linear-gradient(180deg, rgba(212,175,55,.08), transparent);
  border: 1px solid var(--border);
  border-radius: 18px;
}
.header h1 {
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: .08em;
  background: linear-gradient(180deg, var(--gold-bright), var(--gold) 50%, var(--gold-dark));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 4px;
}
.header .sub {
  font-size: .68rem;
  color: var(--txt-3);
  letter-spacing: .2em;
  text-transform: uppercase;
  font-weight: 700;
}

/* Статус-карточка */
.status-card {
  background: var(--bg-2);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: .3s;
}
.status-card.active {
  border-color: var(--red);
  background: linear-gradient(180deg, rgba(248,113,113,.1), var(--bg-2));
  box-shadow: 0 0 30px rgba(248,113,113,.2);
}
.status-card.inactive {
  border-color: var(--green);
  background: linear-gradient(180deg, rgba(74,222,128,.08), var(--bg-2));
}
.status-icon {
  font-size: 2.6rem;
  flex-shrink: 0;
  width: 60px;
  text-align: center;
}
.status-card.active .status-icon {
  animation: pulse-icon 1.5s infinite;
}
@keyframes pulse-icon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.status-info { flex: 1; min-width: 0; }
.status-label {
  font-size: .68rem;
  color: var(--txt-3);
  letter-spacing: .15em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 4px;
}
.status-value {
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: .04em;
}
.status-card.active .status-value { color: var(--red); }
.status-card.inactive .status-value { color: var(--green); }
.status-meta {
  font-size: .72rem;
  color: var(--txt-2);
  margin-top: 4px;
}

/* Кнопка */
.big-btn {
  width: 100%;
  padding: 20px;
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: .25s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.big-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  transform: translateX(-100%);
  transition: transform .6s;
}
.big-btn:hover::before { transform: translateX(100%); }
.big-btn:disabled { opacity: .5; cursor: wait; }

.btn-on {
  background: linear-gradient(180deg, #fca5a5, var(--red) 50%, var(--red-dark));
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.btn-on:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(248,113,113,.4); }
.btn-on:active { transform: scale(.98); }

.btn-off {
  background: linear-gradient(180deg, #86efac, var(--green) 50%, var(--green-dark));
  color: #0a0a0a;
}
.btn-off:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(74,222,128,.4); }
.btn-off:active { transform: scale(.98); }

.btn-icon { font-size: 1.5rem; }

/* Форма */
.section {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}
.section-title {
  font-size: .75rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}
.form-group { margin-bottom: 12px; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
  display: block;
  font-size: .68rem;
  color: var(--txt-2);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-weight: 700;
}
.form-input, .form-textarea, .form-select {
  width: 100%;
  background: var(--bg-3);
  border: 1.5px solid var(--border);
  color: var(--txt-1);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: .88rem;
  font-family: inherit;
  outline: none;
  transition: .2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: var(--gold);
}
.form-textarea {
  resize: vertical;
  min-height: 70px;
  font-family: inherit;
}
.presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.preset-btn {
  padding: 6px 12px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--txt-2);
  border-radius: 8px;
  font-size: .7rem;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
  font-family: inherit;
}
.preset-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

/* Лог */
.log {
  background: #000;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.6;
  color: #d4d4d4;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 240px;
  overflow-y: auto;
  min-height: 60px;
  margin-top: 12px;
}
.log .line { padding: 1px 0; }
.log .time { color: #6b6b6b; }
.log .ok { color: var(--green); font-weight: 700; }
.log .err { color: var(--red); font-weight: 700; }
.log .warn { color: #fbbf24; font-weight: 700; }
.log .info { color: #60a5fa; }

/* Вспомогательные */
.hint {
  font-size: .7rem;
  color: var(--txt-3);
  line-height: 1.6;
  padding: 10px 12px;
  background: rgba(212,175,55,.05);
  border: 1px solid rgba(212,175,55,.15);
  border-radius: 10px;
  margin-top: 12px;
}
.hint b { color: var(--gold); }

.footer {
  text-align: center;
  padding: 20px;
  font-size: .68rem;
  color: var(--txt-3);
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 700;
}
.footer b { color: var(--gold); }

@media (max-width: 480px) {
  .header h1 { font-size: 1.1rem; }
  .status-icon { font-size: 2rem; width: 50px; }
  .status-value { font-size: 1rem; }
  .big-btn { padding: 16px; font-size: .88rem; }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🎛 Комендантский час</h1>
    <div class="sub">Панель управления</div>
  </div>

  <!-- СТАТУС -->
  <div class="status-card inactive" id="statusCard">
    <div class="status-icon" id="statusIcon">✅</div>
    <div class="status-info">
      <div class="status-label">Текущий статус</div>
      <div class="status-value" id="statusValue">ПРОВЕРКА...</div>
      <div class="status-meta" id="statusMeta">—</div>
    </div>
  </div>

  <!-- КНОПКА -->
  <button class="big-btn btn-on" id="mainBtn" disabled>
    <span class="btn-icon" id="btnIcon">🚨</span>
    <span id="btnText">ПРОВЕРКА СТАТУСА...</span>
  </button>

  <!-- ФОРМА -->
  <div class="section">
    <div class="section-title">⚙️ Параметры</div>

    <div class="form-group">
      <label class="form-label">Пресеты причины</label>
      <div class="presets">
        <button class="preset-btn" data-reason="Сервер на профилактике">🛠 Профилактика</button>
        <button class="preset-btn" data-reason="Обновление игры">🚀 Обновление</button>
        <button class="preset-btn" data-reason="Экстренные работы">🚨 Экстренно</button>
        <button class="preset-btn" data-reason="Технические неполадки">⚠️ Неполадки</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Причина (видит игрок)</label>
      <input type="text" class="form-input" id="reasonInput"
        placeholder="Например: Профилактика сервера" maxlength="120">
    </div>

    <div class="form-group">
      <label class="form-label">Сообщение (видит игрок)</label>
      <textarea class="form-textarea" id="messageInput"
        placeholder="🚨 Комендантский час. Игра временно закрыта." maxlength="300"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Автовыключение (минут)</label>
      <select class="form-select" id="durationSelect">
        <option value="0">Без ограничения (выключить вручную)</option>
        <option value="15">15 минут</option>
        <option value="30">30 минут</option>
        <option value="60">1 час</option>
        <option value="120">2 часа</option>
        <option value="360">6 часов</option>
        <option value="720">12 часов</option>
        <option value="1440">24 часа</option>
      </select>
    </div>
  </div>

  <div class="hint">
    <b>Как работает:</b> открываешь эту страницу → жмёшь кнопку → все игроки видят заглушку <b>curfew.html</b>.<br>
    Когда выключишь — через 15 секунд все автоматически вернутся в игру.
  </div>

  <!-- ЛОГ -->
  <div class="section">
    <div class="section-title">📋 Лог</div>
    <div class="log" id="log"></div>
  </div>

  <div class="footer">
    Powered by <b>Artamon v2.7</b> · Curfew Control
  </div>

</div>

<script>
// ============================================================
// CURFEW-CONTROL.HTML — панель управления комендантским часом
// ============================================================

var API = "https://artamon-api.artem123kv.workers.dev";
var ADMIN_PASS = "artamon-admin-2026"; // ← можно поменять

var currentState = { curfew: false, message: "", reason: "", until: 0 };

var logEl = document.getElementById("log");

function log(msg, cls) {
  var time = new Date().toLocaleTimeString("ru-RU");
  var div = document.createElement("div");
  div.className = "line" + (cls ? " " + cls : "");
  div.innerHTML = '<span class="time">[' + time + ']</span> ' + escapeHtml(msg);
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function formatTime(ts) {
  return new Date(ts).toLocaleString("ru-RU");
}

// ============================================================
// ОБНОВЛЕНИЕ UI
// ============================================================
function render() {
  var card = document.getElementById("statusCard");
  var icon = document.getElementById("statusIcon");
  var value = document.getElementById("statusValue");
  var meta = document.getElementById("statusMeta");
  var btn = document.getElementById("mainBtn");
  var btnIcon = document.getElementById("btnIcon");
  var btnText = document.getElementById("btnText");

  if (currentState.curfew) {
    card.className = "status-card active";
    icon.textContent = "🚨";
    value.textContent = "АКТИВЕН";
    var metaLines = [];
    if (currentState.reason) metaLines.push("📌 " + currentState.reason);
    if (currentState.until > Date.now()) {
      metaLines.push("⏰ До: " + formatTime(currentState.until));
    } else {
      metaLines.push("⏰ До: вручную");
    }
    meta.textContent = metaLines.join(" · ");

    btn.className = "big-btn btn-off";
    btn.disabled = false;
    btnIcon.textContent = "✅";
    btnText.textContent = "ВЫКЛЮЧИТЬ КОМЕНДАНТСКИЙ ЧАС";
  } else {
    card.className = "status-card inactive";
    icon.textContent = "✅";
    value.textContent = "НЕ АКТИВЕН";
    meta.textContent = "Игроки могут заходить в игру";

    btn.className = "big-btn btn-on";
    btn.disabled = false;
    btnIcon.textContent = "🚨";
    btnText.textContent = "ВКЛЮЧИТЬ КОМЕНДАНТСКИЙ ЧАС";
  }
}

// ============================================================
// API
// ============================================================
async function fetchStatus() {
  try {
    var r = await fetch(API + "/api/curfew-status?t=" + Date.now(), { cache: "no-store" });
    var d = await r.json();
    if (d.ok) {
      currentState = {
        curfew: !!d.curfew,
        message: d.message || "",
        reason: d.reason || "",
        until: d.until || 0,
      };
      render();
      return true;
    }
  } catch (e) {
    log("❌ Ошибка проверки: " + e.message, "err");
  }
  return false;
}

async function toggleCurfew() {
  var btn = document.getElementById("mainBtn");
  btn.disabled = true;

  var enable = !currentState.curfew;
  var reason = document.getElementById("reasonInput").value.trim();
  var message = document.getElementById("messageInput").value.trim();
  var durationMin = parseInt(document.getElementById("durationSelect").value, 10) || 0;

  log((enable ? "🚨 Включаю" : "✅ Выключаю") + " комендантский час...", "info");

  try {
    var r = await fetch(API + "/api/admin/curfew-toggle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: ADMIN_PASS,
        enable: enable,
        reason: reason,
        message: message,
        durationMin: durationMin,
      })
    });
    var d = await r.json();

    if (!d.ok) {
      log("❌ Ошибка: " + (d.error || "неизвестная"), "err");
      btn.disabled = false;
      return;
    }

    currentState = {
      curfew: !!d.curfew,
      message: d.message || "",
      reason: d.reason || "",
      until: d.until || 0,
    };
    render();
    log(enable ? "✅ Комендантский час ВКЛЮЧЁН" : "✅ Комендантский час ВЫКЛЮЧЕН",
        enable ? "warn" : "ok");
    if (enable && d.until > Date.now()) {
      log("⏰ Автовыключение: " + formatTime(d.until), "info");
    }

  } catch (e) {
    log("❌ Ошибка сети: " + e.message, "err");
    btn.disabled = false;
  }
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
document.getElementById("mainBtn").addEventListener("click", toggleCurfew);

// Пресеты причин
document.querySelectorAll(".preset-btn").forEach(function(b) {
  b.addEventListener("click", function() {
    var reason = b.getAttribute("data-reason");
    document.getElementById("reasonInput").value = reason;
    if (!document.getElementById("messageInput").value) {
      document.getElementById("messageInput").value =
        "🚨 Комендантский час.\n" + reason + ".\nМы скоро вернёмся!";
    }
  });
});

// Первая проверка
log("🔄 Проверяю статус...", "info");
fetchStatus().then(function(ok) {
  if (ok) {
    log(currentState.curfew ? "⚠️ Комендантский час активен" : "✅ Комендантский час выключен",
        currentState.curfew ? "warn" : "ok");
  }
});

// Обновление статуса каждые 30 сек
setInterval(function() {
  if (!document.hidden) fetchStatus();
}, 30000);

// При возврате на вкладку
document.addEventListener("visibilitychange", function() {
  if (!document.hidden) fetchStatus();
});
</script>
</body>
</html>
