<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #eee; font-family: monospace; padding: 14px; font-size: 13px; }
h3 { color: #d4af37; margin-bottom: 12px; text-align: center; }
button {
  display: block; width: 100%; padding: 14px; margin-bottom: 8px;
  background: #d4af37; color: #000; border: none; border-radius: 10px;
  font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer;
}
button:active { transform: scale(.98); }
#out {
  background: #000; color: #4ade80; padding: 12px; border-radius: 10px;
  white-space: pre-wrap; font-size: 11.5px; line-height: 1.6;
  min-height: 200px; max-height: 70vh; overflow-y: auto; margin-top: 12px;
  word-break: break-word;
}
.red { color: #f87171; }
.yel { color: #fbbf24; }
.blu { color: #60a5fa; }
.gry { color: #6b6b6b; }
.wht { color: #fff; font-weight: bold; }
</style>
</head>
<body>

<h3>Artamon Debug v3</h3>

<button onclick="testHTML()">1. Проверить index_v2.html</button>
<button onclick="testJS()">2. Найти ошибку в JS (с точной строкой)</button>
<button onclick="testAPI()">3. Проверить воркер</button>
<button onclick="clearSW()">4. Очистить кэш и перезагрузить</button>

<div id="out">Нажми кнопку...</div>

<script>
var out = document.getElementById("out");

function log(msg, cls) {
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}
function clear() { out.innerHTML = ""; }

/* ТЕСТ 1: HTML */
function testHTML() {
  clear();
  log("=== ПРОВЕРКА index_v2.html ===");
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { log("Файл не найден. Статус: " + xhr.status, "red"); return; }
    var h = xhr.responseText;
    log("Файл загружен: " + h.length + " символов");
    log("");
    var sOpen = h.split("<" + "script>").length - 1;
    var sClose = h.split("<" + "/" + "script>").length - 1;
    log("Скриптов: " + sOpen + " открыто / " + sClose + " закрыто");
    if (sOpen !== sClose) log("СКРИПТЫ НЕ СБАЛАНСИРОВАНЫ!", "red");
    else log("Скрипты закрыты корректно", "");
    log("Размер: " + (h.length < 200000 ? "маленький" : "нормальный"), h.length < 200000 ? "yel" : "");
  };
  xhr.open("GET", "./index_v2.html?v=" + Date.now(), true);
  xhr.send();
}

/* ТЕСТ 2: JS — с поиском точной строки */
function testJS() {
  clear();
  log("=== ПОИСК ОШИБКИ В JS ===");
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { log("Файл не найден", "red"); return; }
    var h = xhr.responseText;
    var openTag = "<" + "script>";
    var closeTag = "<" + "/" + "script>";
    var parts = h.split(openTag);
    var total = parts.length - 1;
    log("Найдено скриптов: " + total);
    log("");
    
    for (var i = 1; i < parts.length; i++) {
      var chunk = parts[i].split(closeTag)[0] || "";
      log("═══════ Скрипт #" + i + " (" + chunk.length + " симв.) ═══════", "blu");
      var preview = chunk.slice(0, 70).replace(/\s+/g, " ");
      log("Начало: " + preview + "...", "gry");
      
      // Сначала проверим весь скрипт
      try {
        new Function(chunk);
        log("Синтаксис OK", "");
        continue;
      } catch(e) {
        log("ОШИБКА: " + e.message, "red");
      }
      
      // Ищем проблему построчно
      log("");
      log("Поиск проблемной строки...", "yel");
      var lines = chunk.split("\n");
      log("Всего строк: " + lines.length);
      
      // Бинарный поиск: проверяем блоки кода
      var errorLine = findErrorLine(lines);
      if (errorLine > 0) {
        log("");
        log("🎯 ПРОБЛЕМНАЯ СТРОКА: #" + errorLine, "wht");
        log("");
        // Показать контекст: 3 строки до и после
        var start = Math.max(0, errorLine - 4);
        var end = Math.min(lines.length, errorLine + 3);
        for (var j = start; j < end; j++) {
          var mark = (j === errorLine - 1) ? ">>> " : "    ";
          var cls = (j === errorLine - 1) ? "red" : "gry";
          log(mark + "[" + (j+1) + "] " + lines[j], cls);
        }
        log("");
        log("Проверь эту строку — там ошибка!", "yel");
      } else {
        log("Не удалось точно определить строку.", "red");
        log("Скорее всего, ошибка в конце скрипта — не закрыта кавычка или скобка.", "yel");
      }
      log("");
    }
  };
  xhr.open("GET", "./index_v2.html?v=" + Date.now(), true);
  xhr.send();
}

/* Поиск проблемной строки через бинарный поиск */
function findErrorLine(lines) {
  var total = lines.length;
  if (total === 0) return 0;
  
  // Сначала ищем первую строку, где ошибка проявляется
  // Пробуем по частям: от начала до N строк
  var lo = 1, hi = total;
  var lastGood = 0;
  var firstBad = total;
  
  // Простой линейный поиск — от 10% до 100%
  var step = Math.max(1, Math.floor(total / 20));
  for (var end = step; end <= total; end += step) {
    var testCode = lines.slice(0, end).join("\n");
    // Добавим закрывающие конструкции для теста
    try {
      new Function(testCode);
      lastGood = end;
    } catch(e) {
      firstBad = end;
      break;
    }
  }
  
  if (lastGood === 0 && firstBad === total) {
    // Ошибка в самом начале или в конце
    // Проверим от 1 до total с шагом 1 в первой части
    for (var k = 1; k <= Math.min(100, total); k++) {
      try { new Function(lines.slice(0, k).join("\n")); lastGood = k; }
      catch(e) { return k; }
    }
    return total;
  }
  
  // Уточняем между lastGood и firstBad
  for (var k = lastGood + 1; k <= firstBad; k++) {
    try {
      new Function(lines.slice(0, k).join("\n"));
    } catch(e) {
      return k;
    }
  }
  
  // Если ничего не нашли — проблема в конце файла
  return total;
}

/* ТЕСТ 3: API */
function testAPI() {
  clear();
  log("=== ПРОВЕРКА ВОРКЕРА ===");
  var xhr = new XMLHttpRequest();
  var t = Date.now();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    var ms = Date.now() - t;
    if (xhr.status === 200) {
      log("Воркер отвечает (" + ms + " мс)", "");
      log("Ответ: " + xhr.responseText);
      try {
        var d = JSON.parse(xhr.responseText);
        if (d.version) log("Версия: " + d.version, d.version === "2.7.0" ? "" : "yel");
      } catch(e) {}
    } else if (xhr.status === 0) {
      log("Воркер НЕ ОТВЕЧАЕТ", "red");
    } else {
      log("HTTP " + xhr.status, "yel");
    }
  };
  xhr.open("GET", "https://artamon-api.artem123kv.workers.dev/", true);
  xhr.send();
}

/* ТЕСТ 4: Очистка кэша */
function clearSW() {
  clear();
  log("=== ОЧИСТКА КЭША ===");
  if (!("serviceWorker" in navigator)) {
    log("Service Worker не поддерживается", "yel");
    return;
  }
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    log("Найдено SW: " + regs.length);
    return Promise.all(regs.map(function(r) { return r.unregister(); }));
  }).then(function() {
    log("SW удалены");
    if (window.caches) {
      return caches.keys().then(function(names) {
        log("Кэшей: " + names.length);
        return Promise.all(names.map(function(n) { return caches.delete(n); }));
      });
    }
  }).then(function() {
    log("Кэши удалены");
    log("");
    log("Перезагрузка через 2 секунды...", "yel");
    setTimeout(function() { location.href = "./index_v2.html?v=" + Date.now(); }, 2000);
  }).catch(function(e) { log("Ошибка: " + e.message, "red"); });
}

log("Debug v3 загружен. Нажми кнопку 1.");
</script>

</body>
</html>
