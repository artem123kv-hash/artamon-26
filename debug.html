<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d4af37">
<title>🔍 Artamon Debug v7</title>
<style>
:root {
  --gold-1: #f6e6a8;
  --gold-2: #d4af37;
  --gold-3: #8f6f1a;
  --bg-0: #050505;
  --bg-1: #0a0a0a;
  --bg-2: #141414;
  --bg-3: #1a1a1a;
  --txt-1: #e8e6e1;
  --txt-2: #8a8a8a;
  --txt-3: #5c5c5c;
  --border: #2a2a2a;
  --ok: #4ade80;
  --err: #f87171;
  --warn: #fbbf24;
  --info: #60a5fa;
  --purple: #a78bfa;
}
body[data-theme="light"] {
  --bg-0: #f8fafc;
  --bg-1: #f1f5f9;
  --bg-2: #ffffff;
  --bg-3: #f8fafc;
  --txt-1: #0f172a;
  --txt-2: #475569;
  --txt-3: #94a3b8;
  --border: #cbd5e1;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg-1);
  color: var(--txt-1);
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  padding: 14px;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(212,175,55,.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 90%, rgba(96,165,250,.06) 0%, transparent 50%);
  transition: background .3s, color .3s;
}

/* HEADER */
.header {
  text-align: center;
  margin-bottom: 18px;
  padding: 16px 12px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(212,175,55,.06), transparent);
  border-radius: 14px;
  position: relative;
}
.header h1 {
  font-size: 1.3rem;
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 45%, var(--gold-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: .08em;
  margin-bottom: 4px;
  font-weight: 900;
}
.header .version {
  font-size: .68rem;
  color: var(--txt-3);
  letter-spacing: .2em;
  text-transform: uppercase;
}
.header .status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  font-size: .7rem;
  color: var(--txt-2);
  padding: 4px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 20px;
}
.header .status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--txt-3);
}
.header .status .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.header .status .dot.off { background: var(--err); box-shadow: 0 0 8px var(--err); }
.theme-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--txt-1);
  font-size: 1.1rem;
  cursor: pointer;
  width: 36px !important;
  min-width: 36px;
}
.theme-btn:hover { border-color: var(--gold-2); }

/* ГРУППЫ КНОПОК */
.group-title {
  font-size: .68rem;
  font-weight: 800;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--gold-2);
  margin: 16px 4px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.group-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* КНОПКИ */
button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 8px;
  background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
  color: var(--txt-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: inherit;
  font-size: .88rem;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: .15s;
  position: relative;
  overflow: hidden;
}
button::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,.08), transparent);
  transform: translateX(-100%);
  transition: transform .5s;
}
button:hover::before { transform: translateX(100%); }
button:hover { border-color: var(--gold-2); box-shadow: 0 4px 16px rgba(212,175,55,.15); }
button:active { transform: scale(.99); }
button:disabled { opacity: .5; cursor: wait; }
button .icon {
  font-size: 1.4rem;
  width: 32px;
  text-align: center;
  flex-shrink: 0;
}
button .label { flex: 1; }
button .label .sub {
  display: block;
  font-size: .7rem;
  color: var(--txt-2);
  font-weight: 400;
  margin-top: 2px;
}
button.primary {
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 60%, var(--gold-3));
  color: #0a0a0a;
  border-color: var(--gold-1);
  font-weight: 800;
}
button.primary .label .sub { color: rgba(0,0,0,.6); }
button.danger {
  background: linear-gradient(180deg, #2a1010, #1a0808);
  border-color: #4a2020;
  color: #fecaca;
}
button.danger:hover { border-color: var(--err); }
button.success {
  background: linear-gradient(180deg, #0f2a10, #081a08);
  border-color: #204a20;
  color: #bbf7d0;
}
button.success:hover { border-color: var(--ok); }
button.info {
  background: linear-gradient(180deg, #0f1a2a, #081018);
  border-color: #20405a;
  color: #bfdbfe;
}
button.info:hover { border-color: var(--info); }

/* КАРТОЧКА СТАТУСА */
.status-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  font-size: .82rem;
}
.status-card .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px dashed var(--border);
}
.status-card .row:last-child { border-bottom: none; }
.status-card .row .k { color: var(--txt-2); }
.status-card .row .v { color: var(--txt-1); font-weight: 700; font-family: ui-monospace, monospace; }
.status-card .row .v.ok { color: var(--ok); }
.status-card .row .v.err { color: var(--err); }
.status-card .row .v.warn { color: var(--warn); }

/* ПРОГРЕСС */
.progress {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: .8rem;
  color: var(--txt-2);
}
.progress.on { display: flex; }
.progress .spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--gold-2);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ЛОГ */
.log {
  background: #000;
  border: 1px solid var(--bg-3);
  border-radius: 12px;
  padding: 14px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.65;
  color: #d4d4d4;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 65vh;
  overflow-y: auto;
  min-height: 120px;
  margin-top: 12px;
  position: relative;
}
body[data-theme="light"] .log {
  background: #1a1a1a;
  color: #d4d4d4;
}
.log .line { padding: 1px 0; }
.log .title {
  color: var(--gold-2);
  font-weight: 800;
  font-size: 12.5px;
  margin-top: 10px;
  padding-top: 6px;
  border-top: 1px solid #1a1a1a;
}
.log .title:first-child { margin-top: 0; border-top: none; padding-top: 0; }
.log .ok { color: var(--ok); font-weight: 700; }
.log .err { color: var(--err); font-weight: 700; }
.log .warn { color: var(--warn); font-weight: 700; }
.log .info { color: var(--info); font-weight: 700; }
.log .purple { color: var(--purple); font-weight: 700; }
.log .dim { color: #6b6b6b; }
.log .error-line {
  background: rgba(248,113,113,.18);
  color: var(--err);
  font-weight: 800;
  padding: 5px 8px;
  border-left: 3px solid var(--err);
  border-radius: 4px;
  margin: 3px 0;
}
.log .context-line {
  color: #8a8a8a;
  padding-left: 10px;
  border-left: 2px solid var(--border);
}
.log .success-line {
  background: rgba(74,222,128,.12);
  color: var(--ok);
  padding: 5px 8px;
  border-left: 3px solid var(--ok);
  border-radius: 4px;
  margin: 3px 0;
}
.log .info-line {
  background: rgba(96,165,250,.12);
  color: var(--info);
  padding: 5px 8px;
  border-left: 3px solid var(--info);
  border-radius: 4px;
  margin: 3px 0;
}

/* ИСТОРИЯ ДЕЙСТВИЙ */
.history-box {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  font-size: .8rem;
}
.history-box .item {
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  color: var(--txt-2);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.history-box .item:last-child { border-bottom: none; }
.history-box .item .t { color: var(--txt-3); font-size: .7rem; font-family: ui-monospace, monospace; }

/* ФУТЕР */
.footer {
  text-align: center;
  margin-top: 20px;
  padding: 14px;
  font-size: .68rem;
  color: var(--txt-3);
  letter-spacing: .1em;
  border-top: 1px solid var(--border);
}
.footer b { color: var(--gold-2); }

/* Скроллбар */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-2); }
</style>
</head>
<body data-theme="dark">

<div class="header">

<script>
// ============================================================
// ARTAMON DEBUG v7.0 — PART 1/2
// ============================================================

var out = document.getElementById("out");
var API_BASE = "https://artamon-api.artem123kv.workers.dev";

var GAME_FILE_CANDIDATES = [
  "./index_v4.html",
  "./index_v4.HTML",
  "./index.html",
  "./index.htm",
  "../index_v4.html",
  "../index.html",
  "/index_v4.html",
  "/index.html",
  "./game/index_v4.html",
  "./game/index.html",
  "./artamon/index_v4.html",
  "./artamon/index.html",
  "./src/index_v4.html",
  "./public/index_v4.html",
  "./dist/index_v4.html",
];

var GAME_FILE_FOUND = null;
var GAME_FILE_CONTENT = null;

// Безопасные "ломаные" строки тегов для HTML
var TAG_SCRIPT_OPEN = "<" + "script";
var TAG_SCRIPT_CLOSE = "<" + "/" + "script>";
var TAG_STYLE_OPEN = "<" + "style";
var TAG_STYLE_CLOSE = "<" + "/" + "style>";

// ============================================================
// ЛОГИРОВАНИЕ
// ============================================================
function log(msg, cls) {
  var d = document.createElement("div");
  d.className = "line" + (cls ? " " + cls : "");
  d.textContent = msg;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}
function clearLog() {
  out.innerHTML = "";
  log("🗑 Лог очищен", "dim");
}
function showProgress(text) {
  document.getElementById("progress").classList.add("on");
  document.getElementById("progressText").textContent = text || "Работаю...";
}
function hideProgress() {
  document.getElementById("progress").classList.remove("on");
}

// ============================================================
// ИСТОРИЯ ДЕЙСТВИЙ
// ============================================================
var HISTORY_KEY = "artamon_debug_history_v1";
function addHistory(action) {
  try {
    var h = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    h.unshift({ action: action, ts: Date.now() });
    if (h.length > 20) h = h.slice(0, 20);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  } catch(e) {}
}
function showHistory() {
  clearLog();
  log("═══ ИСТОРИЯ ДЕЙСТВИЙ ═══", "title");
  log("");
  try {
    var h = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    if (!h.length) {
      log("История пуста", "dim");
      return;
    }
    h.forEach(function(item) {
      var d = new Date(item.ts);
      var time = d.toLocaleString("ru-RU");
      log(time + "  ·  " + item.action, "info");
    });
  } catch(e) {
    log("❌ " + e.message, "err");
  }
}

// ============================================================
// ПОИСК ФАЙЛА ИГРЫ
// ============================================================
function findGameFile(callback) {
  var i = 0;
  function tryNext() {
    if (i >= GAME_FILE_CANDIDATES.length) { callback(null); return; }
    var path = GAME_FILE_CANDIDATES[i];
    i++;
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        GAME_FILE_FOUND = path;
        callback(path);
      } else {
        tryNext();
      }
    };
    try {
      xhr.open("GET", path + "?t=" + Date.now(), true);
      xhr.send();
    } catch(e) { tryNext(); }
  }
  tryNext();
}

function loadGameFile(callback) {
  if (GAME_FILE_CONTENT) { callback(GAME_FILE_CONTENT, GAME_FILE_FOUND); return; }
  if (GAME_FILE_FOUND) {
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        GAME_FILE_CONTENT = xhr.responseText;
        callback(GAME_FILE_CONTENT, GAME_FILE_FOUND);
      } else { callback(null, null); }
    };
    xhr.open("GET", GAME_FILE_FOUND + "?t=" + Date.now(), true);
    xhr.send();
    return;
  }
  showProgress("🔍 Ищу файл игры...");
  findGameFile(function(found) {
    hideProgress();
    if (!found) { callback(null, null); return; }
    loadGameFile(callback);
  });
}

// ============================================================
// 1. УМНЫЙ ПОИСК ОШИБКИ В JS
// ============================================================
function testJS() {
  clearLog();
  log("═══ УМНЫЙ ПОИСК ОШИБКИ В JS ═══", "title");
  log("");
  log("🔍 Ищу файл игры...", "info");
  addHistory("Поиск ошибки в JS");

  loadGameFile(function(h, path) {
    if (!h) {

      log("");

      GAME_FILE_CANDIDATES.forEach(function(p) { log("  " + p, "dim"); });
      return;
    }

    log("✅ Найден: " + path, "ok");
    log("📄 Размер: " + h.length.toLocaleString() + " символов", "dim");
    log("📏 Строк: " + h.split("\n").length, "dim");
    log("");

    var parts = h.split(TAG_SCRIPT_OPEN + ">");
    var total = parts.length - 1;

    log("📦 Найдено скриптов: " + total, "ok");
    log("");

    var errorCount = 0;

    for (var i = 1; i < parts.length; i++) {
      var chunk = parts[i].split(TAG_SCRIPT_CLOSE)[0] || "";
      var chunkLines = chunk.split("\n").length;
      log("─── Скрипт #" + i + " (" + chunk.length.toLocaleString() + " симв., " + chunkLines + " строк) ───", "title");

      try {
        new Function(chunk);
        log("✅ Синтаксис OK", "ok");
        log("");
        continue;
      } catch (e) {
        log("❌ ОШИБКА: " + e.message, "err");
        errorCount++;
      }

      log("🔍 Поиск точной строки...", "info");
      var lineNum = findExactLine(chunk);
      var lines = chunk.split("\n");

      if (lineNum > 0 && lineNum <= lines.length) {
        log("🎯 ПРОБЛЕМНАЯ СТРОКА: #" + lineNum, "err");
        log("");

        var start = Math.max(0, lineNum - 5);
        var end = Math.min(lines.length, lineNum + 4);

        log("Контекст:", "info");
        for (var j = start; j < end; j++) {
          var lineText = lines[j] || "(пустая строка)";
          var lineNo = (j + 1).toString().padStart(4, " ");
          if (j === lineNum - 1) {
            log(">>> [" + lineNo + "] " + lineText, "error-line");
          } else {
            log("    [" + lineNo + "] " + lineText, "context-line");
          }
        }
        log("");
        log("👆 Ошибка в строке с >>>", "warn");
      }
      log("");
    }

    log("═══ ИТОГ ═══", "title");
    if (errorCount === 0) {
      log("✅ Все " + total + " скриптов валидны", "ok");
    } else {
      log("❌ Найдено ошибок: " + errorCount + " из " + total + " скриптов", "err");
    }
  });
}

function findExactLine(code) {
  var lines = code.split("\n");
  var total = lines.length;
  if (total === 0) return 0;
  var lo = 1, hi = total, firstInvalid = 0;
  while (lo <= hi) {
    var mid = Math.floor((lo + hi) / 2);
    var testCode = lines.slice(0, mid).join("\n");
    var isValid = false;
    try { new Function(testCode); isValid = true; } catch (err) { isValid = false; }
    if (isValid) lo = mid + 1;
    else { firstInvalid = mid; hi = mid - 1; }
  }
  return firstInvalid;
}

function storageInfo() {
  clearLog();
  log("═══ LOCALSTORAGE ═══", "title");
  log("");
  addHistory("LocalStorage");

  try {
    var total = 0;
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var v = localStorage.getItem(k) || "";
      total += k.length + v.length;
      keys.push({ key: k, size: v.length, value: v });
    }

    keys.sort(function(a, b) { return b.size - a.size; });

    log("📦 Всего ключей: " + keys.length, "info");
    log("📊 Общий размер: " + (total / 1024).toFixed(2) + " КБ", "info");
    log("");

    if (!keys.length) { log("ℹ️ Пусто", "dim"); return; }

    log("─── Ключи ───", "title");
    keys.slice(0, 50).forEach(function(item) {
      log("  " + item.key.padEnd(40) + " " + item.size.toString().padStart(8) + " б", "dim");
    });
    if (keys.length > 50) log("  ... и ещё " + (keys.length - 50), "dim");

    log("");
    log("─── Artamon-ключи ───", "title");
    var artamon = keys.filter(function(k) { return k.key.indexOf("artamon") !== -1; });
    if (!artamon.length) log("Нет ключей с 'artamon'", "dim");
    else artamon.forEach(function(item) {
      var preview = item.value.length > 100 ? item.value.slice(0, 100) + "..." : item.value;
      log("  " + item.key, "info");
      log("    = " + preview, "dim");
    });
  } catch(e) {
    log("❌ " + e.message, "err");
  }
}

// 14. META-ТЕГИ
// ============================================================
function analyzeMetaTags() {
  clearLog();
  log("═══ META-ТЕГИ ═══", "title");
  log("");
  addHistory("Meta-теги");

  loadGameFile(function(h, path) {
    if (!h) { log("❌ Файл НЕ НАЙДЕН", "err"); return; }

    var re = /<meta\s+([^>]+)>/gi;
    var metas = [];
    var m;
    while ((m = re.exec(h)) !== null) metas.push(m[1]);

    log("📦 Найдено meta-тегов: " + metas.length, "info");
    log("");

    var important = ["viewport", "theme-color", "description", "og:title", "og:description", "og:image", "apple-mobile-web-app-capable", "mobile-web-app-capable"];
    var found = {};

    metas.forEach(function(mt) {
      var nameMatch = mt.match(/name\s*=\s*["']([^"']+)["']/i);
      var propMatch = mt.match(/property\s*=\s*["']([^"']+)["']/i);
      var contentMatch = mt.match(/content\s*=\s*["']([^"']+)["']/i);
      var name = (nameMatch ? nameMatch[1] : (propMatch ? propMatch[1] : "?")).toLowerCase();
      var content = contentMatch ? contentMatch[1] : "";
      found[name] = content;
    });

    important.forEach(function(k) {
      if (found[k] !== undefined) {
        log("✅ " + k + " = " + found[k], "ok");
      } else {
        log("❌ " + k + " — отсутствует", "warn");
      }
    });

    log("");
    log("─── Все meta-теги ───", "title");
    Object.keys(found).forEach(function(k) {
      log("  " + k + ": " + (found[k].length > 80 ? found[k].slice(0, 80) + "..." : found[k]), "dim");
    });

    // Title
    var titleMatch = h.match(/<title>([^<]*)<\/title>/i);
    log("");
    log("📌 Title: " + (titleMatch ? titleMatch[1] : "(нет)"), "info");
  });
}

// 18. НЕБЕЗОПАСНЫЕ ПАТТЕРНЫ
// ============================================================
function findUnsafePatterns() {
  clearLog();
  log("═══ НЕБЕЗОПАСНЫЕ ПАТТЕРНЫ ═══", "title");
  log("");
  addHistory("Поиск небезопасных паттернов");

  loadGameFile(function(h, path) {
    if (!h) { log("❌ Файл НЕ НАЙДЕН", "err"); return; }

    var patterns = [
      { re: /\beval\s*\(/g, name: "eval()", level: "high" },
      { re: /new\s+Function\s*\(/g, name: "new Function()", level: "high" },
      { re: /document\.write\s*\(/g, name: "document.write()", level: "med" },
      { re: /\.innerHTML\s*=/g, name: ".innerHTML =", level: "med" },
      { re: /\.outerHTML\s*=/g, name: ".outerHTML =", level: "med" },
      { re: /dangerouslySetInnerHTML/g, name: "dangerouslySetInnerHTML", level: "high" },
      { re: /http:\/\//g, name: "http:// (не HTTPS)", level: "med" },
      { re: /localStorage\.setItem/g, name: "localStorage.setItem", level: "low" },
      { re: /javascript:/g, name: "javascript: URL", level: "high" },
      { re: /setTimeout\s*\(\s*["']/g, name: 'setTimeout("строка")', level: "med" },
      { re: /setInterval\s*\(\s*["']/g, name: 'setInterval("строка")', level: "med" },
    ];

    var found = [];
    patterns.forEach(function(p) {
      var m = h.match(p.re);
      if (m) found.push({ name: p.name, count: m.length, level: p.level });
    });

    if (!found.length) {
      log("✅ Небезопасных паттернов не найдено", "ok");
      return;
    }

    log("❌ Найдено " + found.length + " типов паттернов:", "err");
    log("");

    found.sort(function(a, b) { return b.count - a.count; });
    found.forEach(function(f) {
      var icon = f.level === "high" ? "🔴" : f.level === "med" ? "🟡" : "🟢";
      log("  " + icon + " " + f.name + " — " + f.count + " раз", f.level === "high" ? "err" : f.level === "med" ? "warn" : "dim");
    });

    log("");
    log("─── Рекомендации ───", "title");
    log("🔴 high = серьёзная уязвимость (XSS, code injection)", "err");
    log("🟡 med  = потенциальная проблема", "warn");
    log("🟢 low  = не критично", "dim");
  });
}

// 20. ОЧИСТКА КЭША
// ============================================================
function clearSW() {
  clearLog();
  log("═══ ОЧИСТКА КЭША ═══", "title");
  log("");
  addHistory("Очистка кэша");

  if (!("serviceWorker" in navigator)) {
    log("⚠️ Service Worker не поддерживается", "warn");
  } else {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      log("Найдено Service Workers: " + regs.length, "info");
      return Promise.all(regs.map(function(r) { return r.unregister(); }));
    }).then(function() {
      log("✅ Service Workers удалены", "ok");
      if (window.caches) {
        return caches.keys().then(function(names) {
          log("Найдено кэшей: " + names.length, "info");
          return Promise.all(names.map(function(n) { return caches.delete(n); }));
        });
      }
    }).then(function() {
      log("✅ Кэши удалены", "ok");
      log("");
      log("🔄 Перезагрузка через 2 секунды...", "warn");
      setTimeout(function() {
        var target = GAME_FILE_FOUND || "./index_v4.html";
        location.href = target + "?v=" + Date.now();
      }, 2000);
    }).catch(function(e) {
      log("❌ " + e.message, "err");
    });
  }
}

function exportLog() {

  addHistory("Экспорт лога");

  var header = "=== ARTAMON DEBUG v7 LOG ===\n" +
               "Дата: " + new Date().toLocaleString("ru-RU") + "\n" +
               "URL: " + location.href + "\n" +
               "UA: " + navigator.userAgent + "\n" +

  var blob = new Blob([header + text], { type: "text/plain;charset=utf-8" });

  a.download = "artamon-debug-" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".txt";
  a.click();
  URL.revokeObjectURL(url);

// 23. ТЕМА
// ============================================================
function applyTheme(theme) {
  document.body.setAttribute("data-theme", theme);
  try { localStorage.setItem("artamon_debug_theme", theme); } catch(e) {}
  var btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = theme === "light" ? "☀️" : "🌙";
}
function toggleTheme() {
  var cur = document.body.getAttribute("data-theme");
  applyTheme(cur === "light" ? "dark" : "light");
}

// ============================================================
function updateNetStatus() {
  var dot = document.getElementById("netDot");
  var status = document.getElementById("netStatus");
  if (navigator.onLine) {
    dot.className = "dot on";
    status.textContent = "Онлайн";
  } else {
    dot.className = "dot off";
    status.textContent = "Офлайн";
  }
}
window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);
