<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artamon Debug</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a10;
  color: #e8e8f0;
  font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
  padding: 12px;
  min-height: 100vh;
}
h1 {
  text-align: center;
  color: #d4af37;
  font-size: 20px;
  margin-bottom: 4px;
}
.sub {
  text-align: center;
  color: #8888a0;
  font-size: 11px;
  margin-bottom: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.status {
  text-align: center;
  font-size: 11px;
  color: #8888a0;
  margin-bottom: 16px;
}
.status b { color: #4ade80; }
.status b.off { color: #f87171; }

.group {
  color: #d4af37;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin: 16px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid #252532;
}

button.test {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  margin-bottom: 6px;
  background: #1a1a24;
  border: 1px solid #252532;
  border-radius: 10px;
  color: #e8e8f0;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s;
}
button.test:hover { background: #22222e; border-color: #d4af37; }
button.test:active { transform: scale(0.98); }
button.test:disabled { opacity: 0.5; cursor: wait; }
button.test .sub { display: block; font-size: 11px; color: #8888a0; font-weight: 400; margin-top: 2px; }
button.test.primary { background: linear-gradient(135deg, #f6e6a8, #d4af37); color: #0a0a0a; border-color: #f6e6a8; }
button.test.primary .sub { color: rgba(0,0,0,0.6); }
button.test.danger { background: #2a1010; border-color: #4a2020; color: #fecaca; }
button.test.success { background: #0f2a10; border-color: #204a20; color: #bbf7d0; }
button.test.info { background: #0f1a2a; border-color: #20405a; color: #bfdbfe; }

#out {
  background: #000;
  border: 1px solid #252532;
  border-radius: 10px;
  padding: 12px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
  line-height: 1.7;
  color: #d4d4d4;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 60vh;
  overflow-y: auto;
  min-height: 200px;
  margin-top: 8px;
}
#out .t { color: #d4af37; font-weight: 700; margin-top: 8px; }
#out .ok { color: #4ade80; }
#out .err { color: #f87171; }
#out .warn { color: #fbbf24; }
#out .info { color: #60a5fa; }
#out .dim { color: #6b6b6b; }
#out .box { display: block; padding: 6px 10px; margin: 4px 0; border-radius: 6px; }
#out .box.ok { background: rgba(74,222,128,0.12); border-left: 3px solid #4ade80; }
#out .box.err { background: rgba(248,113,113,0.15); border-left: 3px solid #f87171; }
#out .box.info { background: rgba(96,165,250,0.12); border-left: 3px solid #60a5fa; }
#out .box.warn { background: rgba(251,191,36,0.12); border-left: 3px solid #fbbf24; }

.toolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.toolbar button {
  padding: 6px 10px;
  background: #1a1a24;
  border: 1px solid #252532;
  border-radius: 6px;
  color: #8888a0;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.toolbar button:hover { border-color: #d4af37; color: #d4af37; }

.progress {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 8px;
  background: #12121a;
  border: 1px solid #d4af37;
  border-radius: 10px;
  font-size: 12px;
}
.progress.on { display: flex; }
.progress .spin {
  width: 16px; height: 16px;
  border: 2px solid #252532;
  border-top-color: #d4af37;
  border-radius: 50%;
  animation: sp 0.8s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }

#toasts {
  position: fixed;
  top: 12px; right: 12px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 300px;
}
.toast {
  padding: 10px 14px;
  background: #12121a;
  border: 1.5px solid #d4af37;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  transform: translateX(150%);
  transition: 0.3s;
}
.toast.on { transform: translateX(0); }
.toast.ok { border-color: #4ade80; color: #4ade80; }
.toast.err { border-color: #f87171; color: #f87171; }
.toast.warn { border-color: #fbbf24; color: #fbbf24; }

#fatal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  color: #f87171;
  padding: 20px;
  font: 12px/1.6 ui-monospace, monospace;
  white-space: pre-wrap;
  overflow: auto;
  z-index: 99999;
}
</style>
</head>
<body>

<h1>🔍 Artamon Debug</h1>
<div class="sub">Version 10 · Simple</div>
<div class="status" id="net">Онлайн: <b>—</b></div>

<div class="toolbar">
  <button onclick="filterLog('all')">Все</button>
  <button onclick="filterLog('err')">Ошибки</button>
  <button onclick="filterLog('warn')">Warn+</button>
  <button onclick="copyLog()">📋 Копировать</button>
  <button onclick="clearLog()">🗑 Очистить</button>
</div>

<div class="progress" id="prog">
  <div class="spin"></div>
  <span id="progText">Работаю...</span>
</div>

<div id="out"></div>

<div id="toasts"></div>
<pre id="fatal"></pre>

<script>
/* ═══════════════════════════════════════════════════════════
   ARTAMON DEBUG v10 — Simple & Working
   ═══════════════════════════════════════════════════════════ */

// ─── ЛОВИМ ЛЮБУЮ ОШИБКУ ───
window.onerror = function(msg, src, line, col) {
  var f = document.getElementById("fatal");
  f.style.display = "block";
  f.textContent = "❌ ОШИБКА\n\n" + msg + "\n\n" + src + " : " + line + ":" + col;
  return false;
};

// ─── КОНСТАНТЫ ───
var API_BASE = "https://artamon-api.artem123kv.workers.dev";
var GAME_PATHS = [
  "./index_v4.html", "./index.html", "../index.html",
  "/index.html", "./game/index.html", "./artamon/index.html",
  "./src/index.html", "./public/index.html", "./dist/index.html"
];

// ─── СОСТОЯНИЕ ───
var gamePath = null;
var gameContent = null;
var logFilter = "all";
var busy = false;

// ─── DOM ───
var out = document.getElementById("out");

// ─── ЛОГИРОВАНИЕ ───
function log(text, cls) {
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = text;
  d.dataset.level = cls || "";
  if (!matchesFilter(d)) d.style.display = "none";
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}

function matchesFilter(node) {
  var lvl = node.dataset.level || "";
  if (logFilter === "all") return true;
  if (logFilter === "err") return lvl.indexOf("err") !== -1;
  if (logFilter === "warn") return lvl.indexOf("err") !== -1 || lvl.indexOf("warn") !== -1;
  return true;
}

function filterLog(f) {
  logFilter = f;
  var nodes = out.children;
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].style.display = matchesFilter(nodes[i]) ? "" : "none";
  }
}

function clearLog() {
  out.innerHTML = "";
  log("Лог очищен", "dim");
}

function copyLog() {
  var t = out.textContent || "";
  if (!t) { toast("Лог пуст", "warn"); return; }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(t).then(function() {
      toast("Скопировано", "ok");
    }).catch(function() {
      toast("Не удалось", "err");
    });
  } else {
    toast("Clipboard недоступен", "warn");
  }
}

// ─── КРАСИВЫЕ ОБЁРТКИ ───
function title(t)  { log("═══ " + t + " ═══", "t"); }
function ok(t)     { log(t, "ok"); }
function err(t)    { log(t, "err"); }
function warn(t)   { log(t, "warn"); }
function info(t)   { log(t, "info"); }
function dim(t)    { log(t, "dim"); }
function blank()   { log(""); }
function box(t, k) { log(t, "box " + (k || "info")); }

// ─── ПРОГРЕСС ───
function showProg(text) {
  document.getElementById("progText").textContent = text || "Работаю...";
  document.getElementById("prog").classList.add("on");
}
function setProg(text) {
  document.getElementById("progText").textContent = text;
}
function hideProg() {
  document.getElementById("prog").classList.remove("on");
}

// ─── ТОСТЫ ───
function toast(msg, type) {
  var t = document.createElement("div");
  t.className = "toast " + (type || "");
  t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(function() { t.classList.add("on"); }, 20);
  setTimeout(function() {
    t.classList.remove("on");
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 400);
  }, 3000);
}

// ─── СТАТУС СЕТИ ───
function updateNet() {
  var b = document.querySelector("#net b");
  if (navigator.onLine) { b.textContent = "Да"; b.className = ""; }
  else { b.textContent = "Нет"; b.className = "off"; }
}
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);

// ─── HTTP ───
function httpGet(url, cb) {
  var xhr = new XMLHttpRequest();
  var t0 = Date.now();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    cb(xhr.status, xhr.responseText, Date.now() - t0);
  };
  try {
    xhr.open("GET", url, true);
    xhr.timeout = 12000;
    xhr.send();
  } catch (e) {
    cb(0, "", 0);
  }
}

function httpPost(url, body, cb) {
  var xhr = new XMLHttpRequest();
  var t0 = Date.now();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    cb(xhr.status, xhr.responseText, Date.now() - t0);
  };
  try {
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.timeout = 12000;
    xhr.send(JSON.stringify(body || {}));
  } catch (e) {
    cb(0, "", 0);
  }
}

// ─── ПОИСК ФАЙЛА ИГРЫ ───
function findGameFile(cb) {
  var i = 0;
  function next() {
    if (i >= GAME_PATHS.length) { cb(null); return; }
    var p = GAME_PATHS[i++];
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) cb(p);
      else next();
    };
    try {
      xhr.open("GET", p + "?t=" + Date.now(), true);
      xhr.send();
    } catch (e) { next(); }
  }
  next();
}

function withGameFile(handler) {
  if (gameContent) { handler(gameContent, gamePath); return; }
  showProg("🔍 Ищу файл игры...");
  findGameFile(function(found) {
    if (!found) {
      hideProg();
      err("❌ Файл игры не найден");
      blank();
      warn("Проверенные пути:");
      for (var i = 0; i < GAME_PATHS.length; i++) dim("  " + GAME_PATHS[i]);
      toast("Файл не найден", "err");
      return;
    }
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      hideProg();
      if (xhr.status !== 200) {
        err("❌ Не удалось загрузить: " + found);
        toast("Ошибка загрузки", "err");
        return;
      }
      gamePath = found;
      gameContent = xhr.responseText;
      ok("✅ Найден: " + found);
      dim("📄 Размер: " + gameContent.length.toLocaleString() + " симв., строк: " + gameContent.split("\n").length);
      blank();
      handler(gameContent, gamePath);
    };
    xhr.open("GET", found + "?t=" + Date.now(), true);
    xhr.send();
  });
}

// ─── УТИЛИТЫ ───
function bytes(n) { return n.toLocaleString("ru-RU"); }
function pct(a, b) { return Math.round((a / b) * 100); }
function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }
function padNum(n, w) { n = String(n); while (n.length < w) n = " " + n; return n; }

function splitScripts(html) {
  var tag = "<" + "script" + ">";
  var endTag = "<" + "/" + "script>";
  var parts = html.split(tag);
  var out = [];
  for (var i = 1; i < parts.length; i++) {
    out.push(parts[i].split(endTag)[0] || "");
  }
  return out;
}

function splitStyles(html) {
  var re = new RegExp("<" + "style[^>]*>([\\s\\S]*?)<" + "/" + "style>", "g");
  var out = [];
  var m;
  while ((m = re.exec(html)) !== null) out.push(m[1]);
  return out;
}

// ─── ПОИСК ТОЧНОЙ СТРОКИ ───
function findErrorLine(code) {
  var lines = code.split("\n");
  var total = lines.length;
  if (!total) return 0;
  var lo = 1, hi = total, firstBad = 0;
  while (lo <= hi) {
    var mid = Math.floor((lo + hi) / 2);
    var test = lines.slice(0, mid).join("\n");
    var valid = false;
    try { new Function(test); valid = true; } catch (e) { valid = false; }
    if (valid) lo = mid + 1;
    else { firstBad = mid; hi = mid - 1; }
  }
  return firstBad || 1;
}

// ─── ЗАПРОС ПАРОЛЯ ───
function askPassword(cb) {
  var p = prompt("Пароль owner (можно пусто):", "");
  if (p === null) { cb(null); return; }
  cb(p);
}

// ─── МОДАЛКА-ПОДТВЕРЖДЕНИЕ ───
function askConfirm(msg, cb) {
  cb(confirm(msg));
}

/* ═══════════════════════════════════════════════════════════
   ТЕСТЫ
   ═══════════════════════════════════════════════════════════ */

function testJS() {
  title("ПОИСК ОШИБКИ В JS");
  withGameFile(function(html) {
    var scripts = splitScripts(html);
    ok("Найдено скриптов: " + scripts.length);
    blank();
    var errors = 0;
    for (var i = 0; i < scripts.length; i++) {
      var code = scripts[i];
      var lines = code.split("\n");
      title("Скрипт #" + (i + 1) + " (" + bytes(code.length) + " симв., " + lines.length + " строк)");
      var syntaxErr = null;
      try { new Function(code); } catch (e) { syntaxErr = e; }
      if (!syntaxErr) {
        ok("✅ Синтаксис OK");
        blank();
        continue;
      }
      errors++;
      err("❌ ОШИБКА: " + syntaxErr.message);
      var ln = findErrorLine(code);
      if (ln > 0 && ln <= lines.length) {
        blank();
        err("🎯 ПРОБЛЕМНАЯ СТРОКА: #" + ln);
        blank();
        info("Контекст:");
        var s = Math.max(0, ln - 5);
        var e = Math.min(lines.length, ln + 4);
        for (var j = s; j < e; j++) {
          var txt = lines[j] || "(пусто)";
          var num = padNum(j + 1, 4);
          if (j === ln - 1) box(">>> [" + num + "] " + txt, "err");
          else log("    [" + num + "] " + txt, "dim");
        }
        blank();
        warn("👆 Ошибка в строке с >>>");
      } else {
        warn("⚠️ Первые 20 строк:");
        for (var k = 0; k < Math.min(20, lines.length); k++) {
          log("[" + (k + 1) + "] " + (lines[k] || ""), "dim");
        }
      }
      blank();
    }
    title("ИТОГ");
    if (errors === 0) { ok("✅ Все " + scripts.length + " скриптов валидны"); toast("Скрипты OK", "ok"); }
    else { err("❌ Ошибок: " + errors + " из " + scripts.length); toast("Ошибок: " + errors, "err"); }
  });
}

function testHTML() {
  title("ПРОВЕРКА HTML");
  withGameFile(function(html) {
    var scriptOpen = "<" + "script";
    var scriptClose = "<" + "/" + "script>";
    var sOpen = html.split(scriptOpen).length - 1;
    var sClose = html.split(scriptClose).length - 1;
    info("Открывающих " + scriptOpen + ": " + sOpen);
    info("Закрывающих " + scriptClose + ": " + sClose);
    if (sOpen !== sClose) err("❌ Разница: " + (sOpen - sClose));
    else ok("✅ Скрипты сбалансированы");
    blank();
    var checks = [
      ['id="intro"', "Интро"],
      ['id="anniversary"', "Юбилей"],
      ['id="mainSite"', "Основной сайт"],
      ['id="preloader"', "Прелоадер"],
      ["SAFE_STORE", "Хранилище"],
      ["INTRO", "Модуль интро"],
      ["COINS", "Монеты"],
      ["ARTAMON_API", "API"],
      ["WHEEL", "Колесо"],
      ["QUESTS", "Квесты"],
      ["FRIENDS", "Друзья"],
      ["SUPPORT", "Поддержка"]
    ];
    var found = 0;
    info("Ключевые элементы:");
    for (var i = 0; i < checks.length; i++) {
      var has = html.indexOf(checks[i][0]) !== -1;
      if (has) found++;
      log("  " + (has ? "✅" : "❌") + " " + checks[i][1], has ? "ok" : "err");
    }
    blank();
    var p = pct(found, checks.length);
    log("Найдено: " + found + " / " + checks.length + " (" + p + "%)", p === 100 ? "ok" : p > 70 ? "warn" : "err");
    toast("Найдено: " + found + "/" + checks.length, p === 100 ? "ok" : "warn");
  });
}

function testSize() {
  title("АНАЛИЗ РАЗМЕРА");
  withGameFile(function(html) {
    var total = html.length;
    info("📊 Всего: " + bytes(total) + " символов");
    blank();
    var headEnd = html.indexOf("</head>");
    var bodyStart = html.indexOf("<body");
    var bodyEnd = html.lastIndexOf("</body>");
    if (headEnd > 0) dim("HEAD: " + bytes(headEnd) + " симв. (" + pct(headEnd, total) + "%)");
    if (bodyEnd > 0) dim("BODY: " + bytes(bodyEnd - bodyStart) + " симв. (" + pct(bodyEnd - bodyStart, total) + "%)");
    blank();
    var cssBlocks = splitStyles(html);
    var cssSize = 0;
    for (var i = 0; i < cssBlocks.length; i++) cssSize += cssBlocks[i].length;
    info("🎨 CSS: " + bytes(cssSize) + " симв., блоков: " + cssBlocks.length);
    var scripts = splitScripts(html);
    var jsSize = 0;
    for (var j = 0; j < scripts.length; j++) jsSize += scripts[j].length;
    info("⚙️ JS: " + bytes(jsSize) + " симв., блоков: " + scripts.length);
    blank();
    title("Размеры скриптов");
    for (var k = 0; k < scripts.length; k++) {
      dim("  #" + (k + 1) + " " + padNum(bytes(scripts[k].length), 9) + " симв. " + padNum(scripts[k].split("\n").length, 5) + " строк");
    }
    blank();
    if (total > 500000) warn("⚠️ Файл > 500КБ");
    else ok("✅ Размер в норме");
    toast("Размер: " + Math.round(total / 1024) + " КБ", "info");
  });
}

function testSearch() {
  var q = prompt("Что искать в файле игры?", "ARTAMON_API");
  if (!q) return;
  title("ПОИСК: " + q);
  withGameFile(function(html) {
    var lines = html.split("\n");
    var count = 0;
    for (var i = 0; i < lines.length; i++) {
      var pos = lines[i].indexOf(q);
      if (pos === -1) continue;
      count++;
      if (count <= 30) {
        var before = lines[i].slice(Math.max(0, pos - 30), pos);
        var after = lines[i].slice(pos + q.length, pos + q.length + 30);
        box("[" + (i + 1) + "] ..." + before + "«" + q + "»" + after + "...", "info");
      }
    }
    blank();
    if (count === 0) { err("❌ Ничего не найдено"); toast("Не найдено", "err"); }
    else { ok("✅ Найдено: " + count); toast("Найдено: " + count, "ok"); }
  });
}

function testCSS() {
  title("ПРОВЕРКА CSS");
  withGameFile(function(html) {
    var blocks = splitStyles(html);
    info("Найдено CSS-блоков: " + blocks.length);
    blank();
    var allOk = true;
    for (var i = 0; i < blocks.length; i++) {
      var css = blocks[i];
      title("Блок #" + (i + 1) + " (" + bytes(css.length) + " симв.)");
      var open = (css.match(/\{/g) || []).length;
      var close = (css.match(/\}/g) || []).length;
      dim("  { : " + open + "    } : " + close);
      if (open !== close) { err("  ❌ Не сбалансированы! Разница: " + (open - close)); allOk = false; }
      else ok("  ✅ Скобки OK");
      var cOpen = (css.match(/\/\*/g) || []).length;
      var cClose = (css.match(/\*\//g) || []).length;
      if (cOpen !== cClose) { err("  ❌ Комментарии не сбалансированы"); allOk = false; }
      var rules = (css.match(/[^{}]+\{[^{}]*\}/g) || []).length;
      dim("  📐 Правил: " + rules);
      blank();
    }
    title("ИТОГ");

    ];
    var total = tests.length;
    var done = 0, success = 0, errors = 0;

    function next() {

        hideProg();
        blank();
        title("ИТОГ");
        info("Всего: " + total);
        log("Успешно: " + success, success === total ? "ok" : "warn");
        log("Ошибок: " + errors, errors === 0 ? "ok" : "err");

        return;
      }
      var t = tests[idx++];
      var body = {};
      if (t.body) { for (var k in t.body) body[k] = t.body[k]; }
      if (t.pass && password) body.password = password;

      function handle(status, text, ms) {
        done++;
        setProg("Тестирую " + done + "/" + total + "...");
        var icon, cls;
        if (status === 200) { icon = "✅"; cls = "ok"; success++; }
        else if (status === 403) { icon = "🔒"; cls = "warn"; errors++; }
        else if (status === 503) { icon = "⚠️"; cls = "warn"; errors++; }
        else if (status === 0) { icon = "❌"; cls = "err"; errors++; }
        else { icon = "⚠️"; cls = "warn"; errors++; }

        var preview = "";
        try {
          var d = JSON.parse(text);
          if (d.error) preview = " · " + d.error;
          else if (d.ok) preview = " · OK";
        } catch (e) {}

        log(icon + " [" + status + "] " + pad(t.n, 22) + " (" + ms + "ms)" + preview, cls);
        next();
      }

      if (t.m === "POST") httpPost(API_BASE + t.p + "?t=" + Date.now(), body, handle);
      else httpGet(API_BASE + t.p + "?t=" + Date.now(), handle);
    }
    next();
  });

    return;
  }
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    info("Найдено SW: " + regs.length);
    var promises = [];
    for (var i = 0; i < regs.length; i++) promises.push(regs[i].unregister());
    return Promise.all(promises);
  }).then(function() {
    ok("✅ Service Workers удалены");
    if ("caches" in window) {
      return caches.keys().then(function(names) {
        info("Найдено кэшей: " + names.length);
        var promises = [];
        for (var i = 0; i < names.length; i++) promises.push(caches.delete(names[i]));
        return Promise.all(promises);
      });
    }
  }).then(function() {
    ok("✅ Кэши удалены");
    info("💡 Перезагрузи страницу");
    toast("Кэш очищен", "ok");

(function buildUI() {
  var container = document.createElement("div");
  for (var g = 0; g < GROUPS.length; g++) {
    var grp = GROUPS[g];
    var h = document.createElement("div");
    h.className = "group";
    h.textContent = grp.name;
    container.appendChild(h);

    for (var i = 0; i < grp.items.length; i++) {
      var item = grp.items[i];
      var btn = document.createElement("button");
      btn.className = "test" + (item.cls ? " " + item.cls : "");
      btn.innerHTML = item.label + '<span class="sub">' + item.sub + '</span>';
      (function(fn, name) {
        btn.onclick = function() { runTest(fn, name); };
      })(item.fn, item.label);
      container.appendChild(btn);
    }
  }
  var outEl = document.getElementById("out");
  document.body.insertBefore(container, outEl);
})();
