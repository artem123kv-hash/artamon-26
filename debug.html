<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #eee; font-family: monospace; padding: 14px; font-size: 13px; }
h3 { color: #d4af37; margin-bottom: 12px; text-align: center; }
button {
  display: block; width: 100%; padding: 14px; margin-bottom: 8px;
  background: #d4af37; color: #000; border: none; border-radius: 10px;
  font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer;
}
button:active { transform: scale(.98); }
#out {
  background: #000; color: #4ade80; padding: 12px; border-radius: 10px;
  white-space: pre-wrap; font-size: 12px; line-height: 1.6;
  min-height: 200px; max-height: 65vh; overflow-y: auto; margin-top: 12px;
  word-break: break-word;
}
.red { color: #f87171; }
.yel { color: #fbbf24; }
.blu { color: #60a5fa; }
.gry { color: #6b6b6b; }
</style>
</head>
<body>

<h3>Artamon Debug</h3>

<button onclick="testHTML()">1. Проверить index_v2.html</button>
<button onclick="testJS()">2. Проверить JS</button>
<button onclick="testAPI()">3. Проверить воркер</button>
<button onclick="clearSW()">4. Очистить кэш и перезагрузить</button>

<div id="out">Нажми кнопку...</div>

<script>
var out = document.getElementById("out");

function log(msg, cls) {
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}

function clear() {
  out.innerHTML = "";
}

/* ТЕСТ 1: HTML */
function testHTML() {
  clear();
  log("=== ПРОВЕРКА index_v2.html ===");
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) {
      log("Файл не найден. Статус: " + xhr.status, "red");
      return;
    }
    var h = xhr.responseText;
    log("Файл загружен: " + h.length + " символов");
    log("");
    log("Проверка тегов и элементов:");
    log("DOCTYPE: " + (h.indexOf("DOCTYPE") !== -1 ? "OK" : "NET"), h.indexOf("DOCTYPE") !== -1 ? "" : "red");
    log("html закрыт: " + (h.indexOf("</html>") !== -1 ? "OK" : "NET"), h.indexOf("</html>") !== -1 ? "" : "red");
    log("intro: " + (h.indexOf("id=\"intro\"") !== -1 ? "OK" : "NET"), h.indexOf("id=\"intro\"") !== -1 ? "" : "red");
    log("anniversary: " + (h.indexOf("id=\"anniversary\"") !== -1 ? "OK" : "NET"), h.indexOf("id=\"anniversary\"") !== -1 ? "" : "red");
    log("mainSite: " + (h.indexOf("id=\"mainSite\"") !== -1 ? "OK" : "NET"), h.indexOf("id=\"mainSite\"") !== -1 ? "" : "red");
    log("preloader: " + (h.indexOf("id=\"preloader\"") !== -1 ? "OK" : "NET"), h.indexOf("id=\"preloader\"") !== -1 ? "" : "red");
    log("SAFE_STORE: " + (h.indexOf("SAFE_STORE") !== -1 ? "OK" : "NET"), h.indexOf("SAFE_STORE") !== -1 ? "" : "red");
    log("INTRO: " + (h.indexOf("INTRO") !== -1 ? "OK" : "NET"), h.indexOf("INTRO") !== -1 ? "" : "red");
    log("COINS: " + (h.indexOf("COINS") !== -1 ? "OK" : "NET"), h.indexOf("COINS") !== -1 ? "" : "red");
    log("ARTAMON_API: " + (h.indexOf("ARTAMON_API") !== -1 ? "OK" : "NET"), h.indexOf("ARTAMON_API") !== -1 ? "" : "red");
    log("WHEEL: " + (h.indexOf("WHEEL") !== -1 ? "OK" : "NET"), h.indexOf("WHEEL") !== -1 ? "" : "red");
    log("QUESTS: " + (h.indexOf("QUESTS") !== -1 ? "OK" : "NET"), h.indexOf("QUESTS") !== -1 ? "" : "red");
    log("FRIENDS: " + (h.indexOf("FRIENDS") !== -1 ? "OK" : "NET"), h.indexOf("FRIENDS") !== -1 ? "" : "red");
    log("SUPPORT: " + (h.indexOf("SUPPORT") !== -1 ? "OK" : "NET"), h.indexOf("SUPPORT") !== -1 ? "" : "red");
    log("");
    var sOpen = h.split("<" + "script>").length - 1;
    var sClose = h.split("<" + "/" + "script>").length - 1;
    log("Открывающих script: " + sOpen);
    log("Закрывающих script: " + sClose);
    if (sOpen !== sClose) log("СКРИПТЫ НЕ СБАЛАНСИРОВАНЫ!", "red");
    else log("Скрипты закрыты корректно", "");
    log("");
    if (h.length < 200000) log("Файл маленький (< 200KB) - проверь все 5 частей", "yel");
    else log("Размер файла нормальный", "");
  };
  xhr.open("GET", "./index_v2.html?v=" + Date.now(), true);
  xhr.send();
}

/* ТЕСТ 2: JS */
function testJS() {
  clear();
  log("=== ПРОВЕРКА СИНТАКСИСА JS ===");
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { log("Файл не найден", "red"); return; }
    var h = xhr.responseText;
    var openTag = "<" + "script>";
    var closeTag = "<" + "/" + "script>";
    var parts = h.split(openTag);
    var total = parts.length - 1;
    log("Найдено скриптов: " + total);
    log("");
    var errors = 0;
    for (var i = 1; i < parts.length; i++) {
      var chunk = parts[i].split(closeTag)[0] || "";
      log("--- Скрипт #" + i + " (" + chunk.length + " симв.) ---", "blu");
      var preview = chunk.slice(0, 80).replace(/\s+/g, " ");
      log("Начало: " + preview + "...", "gry");
      try {
        new Function(chunk);
        log("Синтаксис OK", "");
      } catch(e) {
        errors++;
        log("ОШИБКА: " + e.message, "red");
      }
      log("");
    }
    log("=== ИТОГО ===", "blu");
    log("Скриптов: " + total);
    log("Ошибок: " + errors, errors > 0 ? "red" : "");
    if (errors === 0) log("JS КОРРЕКТНЫЙ", "");
    else log("ЕСТЬ ОШИБКИ - смотри выше", "red");
  };
  xhr.open("GET", "./index_v2.html?v=" + Date.now(), true);
  xhr.send();
}

/* ТЕСТ 3: API */
function testAPI() {
  clear();
  log("=== ПРОВЕРКА ВОРКЕРА ===");
  var xhr = new XMLHttpRequest();
  var t = Date.now();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    var ms = Date.now() - t;
    if (xhr.status === 200) {
      log("Воркер отвечает (" + ms + " мс)", "");
      log("Ответ: " + xhr.responseText);
      try {
        var d = JSON.parse(xhr.responseText);
        if (d.version) log("Версия воркера: " + d.version, d.version === "2.7.0" ? "" : "yel");
      } catch(e) {}
    } else if (xhr.status === 0) {
      log("Воркер НЕ ОТВЕЧАЕТ", "red");
      log("Проверь, задеплоен ли воркер в Cloudflare", "yel");
    } else {
      log("HTTP " + xhr.status, "yel");
      log("Ответ: " + xhr.responseText);
    }
  };
  xhr.open("GET", "https://artamon-api.artem123kv.workers.dev/", true);
  xhr.send();
}

/* ТЕСТ 4: Очистка кэша */
function clearSW() {
  clear();
  log("=== ОЧИСТКА КЭША ===");
  if (!("serviceWorker" in navigator)) {
    log("Service Worker не поддерживается", "yel");
    return;
  }
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    log("Найдено регистраций SW: " + regs.length);
    var promises = regs.map(function(r) { return r.unregister(); });
    return Promise.all(promises);
  }).then(function() {
    log("Service Workers удалены");
    if (window.caches) {
      return caches.keys().then(function(names) {
        log("Найдено кэшей: " + names.length);
        return Promise.all(names.map(function(n) { return caches.delete(n); }));
      });
    }
  }).then(function() {
    log("Кэши удалены");
    log("");
    log("Перезагрузка через 2 секунды...", "yel");
    setTimeout(function() {
      location.href = "./index_v2.html?v=" + Date.now();
    }, 2000);
  }).catch(function(e) {
    log("Ошибка: " + e.message, "red");
  });
}

log("Debug загружен. Нажми кнопку 1.");
</script>

</body>
</html>
