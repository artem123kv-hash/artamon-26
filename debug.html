<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug v4</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #eee; font-family: monospace; padding: 14px; font-size: 13px; }
h3 { color: #d4af37; margin-bottom: 12px; text-align: center; }
button {
  display: block; width: 100%; padding: 14px; margin-bottom: 8px;
  background: #d4af37; color: #000; border: none; border-radius: 10px;
  font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer;
}
button:active { transform: scale(.98); }
#out {
  background: #000; color: #4ade80; padding: 12px; border-radius: 10px;
  white-space: pre-wrap; font-size: 11.5px; line-height: 1.6;
  min-height: 200px; max-height: 75vh; overflow-y: auto; margin-top: 12px;
  word-break: break-word;
}
.red { color: #f87171; }
.yel { color: #fbbf24; }
.blu { color: #60a5fa; }
.gry { color: #6b6b6b; }
.wht { color: #fff; font-weight: bold; }
.grn { color: #4ade80; }
</style>
</head>
<body>

<h3>Artamon Debug v4</h3>

<button onclick="testJS()">🎯 Найти ошибку в JS (умный поиск)</button>
<button onclick="testHTML()">📄 Проверить HTML</button>
<button onclick="testAPI()">🌐 Проверить воркер</button>
<button onclick="clearSW()">🧹 Очистить кэш</button>

<div id="out">Нажми кнопку 1...</div>

<script>
var out = document.getElementById("out");

function log(msg, cls) {
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}
function clear() { out.innerHTML = ""; }

/* ═══════════════════════════════════════════════════════
   ТЕСТ JS — умный поиск ошибки
   ═══════════════════════════════════════════════════════ */
function testJS() {
  clear();
  log("=== УМНЫЙ ПОИСК ОШИБКИ В JS ===", "blu");
  log("");
  
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { log("Файл не найден", "red"); return; }
    
    var h = xhr.responseText;
    var openTag = "<" + "script>";
    var closeTag = "<" + "/" + "script>";
    var parts = h.split(openTag);
    var total = parts.length - 1;
    log("Найдено скриптов: " + total, "grn");
    log("");
    
    for (var i = 1; i < parts.length; i++) {
      var chunk = parts[i].split(closeTag)[0] || "";
      log("═══ Скрипт #" + i + " (" + chunk.length + " симв.) ═══", "blu");
      
      // Проверяем весь скрипт сразу
      try {
        new Function(chunk);
        log("✅ Синтаксис OK", "grn");
        log("");
        continue;
      } catch(e) {
        log("❌ ОШИБКА: " + e.message, "red");
      }
      
      // Ищем точную строку через механизм JS-движка
      var lineNum = findExactLine(chunk, e);
      var lines = chunk.split("\n");
      
      log("Всего строк в скрипте: " + lines.length, "gry");
      log("");
      
      if (lineNum > 0 && lineNum <= lines.length) {
        log("🎯 ПРОБЛЕМНАЯ СТРОКА: #" + lineNum, "wht");
        log("");
        var start = Math.max(0, lineNum - 5);
        var end = Math.min(lines.length, lineNum + 4);
        for (var j = start; j < end; j++) {
          var mark = (j === lineNum - 1) ? ">>> " : "    ";
          var cls = (j === lineNum - 1) ? "red" : "gry";
          log(mark + "[" + (j + 1) + "] " + lines[j], cls);
        }
        log("");
        log("👆 Проверь эту строку — там ошибка!", "yel");
      } else {
        log("⚠️ Не удалось определить строку автоматически.", "yel");
        log("Делаю ручной перебор...", "gry");
        log("");
        
        // Ручной перебор: покажем первые 30 строк и последние 30 строк
        log("=== ПЕРВЫЕ 20 СТРОК ===", "blu");
        for (var k = 0; k < Math.min(20, lines.length); k++) {
          log("[" + (k + 1) + "] " + lines[k], "gry");
        }
        log("");
        log("=== ПОСЛЕДНИЕ 20 СТРОК ===", "blu");
        for (var m = Math.max(0, lines.length - 20); m < lines.length; m++) {
          log("[" + (m + 1) + "] " + lines[m], "gry");
        }
      }
      log("");
    }
  };
  xhr.open("GET", "./index_v2.html?v=" + Date.now(), true);
  xhr.send();
}

/* ═══════════════════════════════════════════════════════
   ТОЧНОЕ ОПРЕДЕЛЕНИЕ СТРОКИ — через eval в блоке
   ═══════════════════════════════════════════════════════ */
function findExactLine(code, err) {
  var lines = code.split("\n");
  
  // Способ 1: если в e.stack есть номер строки — используем его
  if (err && err.stack) {
    var match = err.stack.match(/<anonymous>:(\d+)/);
    if (match) {
      return parseInt(match[1], 10);
    }
  }
  
  // Способ 2: пошаговая проверка через закрытие
  // Пробуем каждые N строк, увеличивая N
  var total = lines.length;
  
  // Сначала проверим: возможно, ошибка в самом конце (незакрытая скобка)
  // Тогда любой префикс упадёт — но падать будет по-разному
  var lastValid = 0;
  var firstInvalid = total;
  
  // Бинарный поиск
  var lo = 1, hi = total;
  while (lo < hi) {
    var mid = Math.floor((lo + hi) / 2);
    var testCode = lines.slice(0, mid).join("\n");
    var valid = false;
    try {
      new Function(testCode + "\n;"); // добавляем ; чтобы избежать ложных ошибок
      valid = true;
    } catch(e) {}
    
    if (valid) {
      lo = mid + 1;
      lastValid = mid;
    } else {
      hi = mid;
      firstInvalid = mid;
    }
  }
  
  // Если нашли первую невалидную строку
  if (firstInvalid > 0 && firstInvalid <= total) {
    // Проверим, не ложное ли это срабатывание — из-за незакрытой функции в начале
    // Откроем контекст: 5 строк до и после
    return firstInvalid;
  }
  
  // Финальный fallback: ищем первую строку с незакрытой кавычкой или скобкой
  return 0;
}

/* ═══════════════════════════════════════════════════════
   HTML
   ═══════════════════════════════════════════════════════ */
function testHTML() {
  clear();
  log("=== ПРОВЕРКА index_v2.html ===", "blu");
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { log("Файл не найден", "red"); return; }
    var h = xhr.responseText;
    log("Файл: " + h.length + " символов", "grn");
    var sOpen = h.split("<" + "script>").length - 1;
    var sClose = h.split("<" + "/" + "script>").length - 1;
    log("Скриптов: " + sOpen + " / " + sClose, sOpen === sClose ? "grn" : "red");
  };
  xhr.open("GET", "./index_v2.html?v=" + Date.now(), true);
  xhr.send();
}

/* ═══════════════════════════════════════════════════════
   API
   ═══════════════════════════════════════════════════════ */
function testAPI() {
  clear();
  log("=== ВОРКЕР ===", "blu");
  var xhr = new XMLHttpRequest();
  var t = Date.now();
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      log("Отвечает (" + (Date.now() - t) + " мс)", "grn");
      log("Ответ: " + xhr.responseText);
    } else {
      log("HTTP " + xhr.status, "red");
    }
  };
  xhr.open("GET", "https://artamon-api.artem123kv.workers.dev/", true);
  xhr.send();
}

/* ═══════════════════════════════════════════════════════
   ОЧИСТКА КЭША
   ═══════════════════════════════════════════════════════ */
function clearSW() {
  clear();
  log("=== ОЧИСТКА КЭША ===", "blu");
  if (!("serviceWorker" in navigator)) {
    log("SW не поддерживается", "yel");
    return;
  }
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    return Promise.all(regs.map(function(r) { return r.unregister(); }));
  }).then(function() {
    if (window.caches) {
      return caches.keys().then(function(names) {
        return Promise.all(names.map(function(n) { return caches.delete(n); }));
      });
    }
  }).then(function() {
    log("✅ Кэш очищен", "grn");
    log("Перезагрузка через 2 сек...", "yel");
    setTimeout(function() { location.href = "./index_v2.html?v=" + Date.now(); }, 2000);
  }).catch(function(e) { log("Ошибка: " + e.message, "red"); });
}

log("Debug v4 загружен. Нажми кнопку 1.", "grn");
</script>

</body>
</html>
