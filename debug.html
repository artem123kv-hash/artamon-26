<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<meta name="color-scheme" content="dark light">
<title>Artamon Debug v9</title>
<style>
/* ═══════════ DESIGN TOKENS ═══════════ */
:root {
  --bg-0:#050507; --bg-1:#0a0a10; --bg-2:#12121a; --bg-3:#1a1a24; --bg-4:#22222e;
  --bd:#252532; --bd-2:#353545; --bd-3:#4a4a5c;
  --fg-1:#e8e8f0; --fg-2:#8888a0; --fg-3:#555568;
  --gold:#d4af37; --gold-lt:#f6e6a8; --gold-dk:#8f6f1a;
  --ok:#4ade80; --err:#f87171; --warn:#fbbf24; --info:#60a5fa;
  --purple:#a78bfa; --cyan:#22d3ee; --pink:#f472b6;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --sh-1:0 4px 12px rgba(0,0,0,.3);
  --sh-2:0 12px 32px rgba(0,0,0,.5);
  --sh-gold:0 8px 24px rgba(212,175,55,.25);
  --t-fast:.15s cubic-bezier(.4,0,.2,1);
  --t-base:.25s cubic-bezier(.4,0,.2,1);
  --t-spring:.4s cubic-bezier(.5,1.5,.5,1);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="light"] {
  --bg-0:#f1f5f9; --bg-1:#f8fafc; --bg-2:#ffffff; --bg-3:#f1f5f9; --bg-4:#e2e8f0;
  --bd:#e2e8f0; --bd-2:#cbd5e1; --bd-3:#94a3b8;
  --fg-1:#0f172a; --fg-2:#475569; --fg-3:#94a3b8;
  --sh-1:0 4px 12px rgba(15,23,42,.08);
  --sh-2:0 12px 32px rgba(15,23,42,.15);
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
}

/* ═══════════ RESET ═══════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { min-height:100dvh; }
body {
  background:var(--bg-1); color:var(--fg-1);
  font:13px/1.5 var(--font-ui);
  overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(212,175,55,.10), transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(96,165,250,.08), transparent 60%);
  background-attachment:fixed;
  padding:16px 14px calc(60px + env(safe-area-inset-bottom));
  transition:background var(--t-base), color var(--t-base);
}
button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input,textarea { font:inherit; color:inherit; }

/* ═══════════ STARFIELD ═══════════ */
.stars { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.star {
  position:absolute; width:2px; height:2px; border-radius:50%;
  background:var(--gold); opacity:0;
  animation:star-pulse 4s ease-in-out infinite;
}
@keyframes star-pulse { 0%,100%{opacity:0} 50%{opacity:.55} }

/* ═══════════ HEADER ═══════════ */
.header {
  position:relative; z-index:1; text-align:center;
  padding:22px 16px 18px; margin-bottom:20px;
  background:linear-gradient(180deg, rgba(212,175,55,.10), transparent 80%);
  border:1px solid var(--bd); border-radius:var(--r-xl);
  overflow:hidden; animation:fade-down .5s ease-out both;
}
@keyframes fade-down { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:none} }
.header::before {
  content:""; position:absolute; inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(212,175,55,.18) 50%,transparent 70%);
  transform:translateX(-100%);
  animation:shimmer 4s ease-in-out infinite;
}
@keyframes shimmer { 0%,100%{transform:translateX(-100%)} 50%{transform:translateX(100%)} }
.header h1 {
  position:relative; font-size:1.5rem; font-weight:900; letter-spacing:.06em;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold) 55%,var(--gold-dk));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:6px; filter:drop-shadow(0 0 24px rgba(212,175,55,.35));
}
.header .version {
  position:relative; font-size:.66rem; color:var(--fg-3);
  letter-spacing:.22em; text-transform:uppercase; font-weight:800;
}
.net-pill {
  position:relative; display:inline-flex; align-items:center; gap:8px;
  margin-top:12px; padding:5px 14px;
  background:var(--bg-2); border:1px solid var(--bd);
  border-radius:999px; font-size:.68rem; font-weight:700;
  color:var(--fg-2); letter-spacing:.08em;
}
.net-pill .dot {
  width:8px; height:8px; border-radius:50%; background:var(--fg-3);
  transition:all var(--t-base);
}
.net-pill .dot.on { background:var(--ok); box-shadow:0 0 10px var(--ok); animation:pulse 2s infinite; }
.net-pill .dot.off { background:var(--err); box-shadow:0 0 10px var(--err); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.35)} }

.icon-btn {
  position:absolute; top:14px; width:38px; height:38px; border-radius:50%;
  background:var(--bg-2); border:1.5px solid var(--bd);
  display:grid; place-items:center; font-size:1.05rem;
  transition:all var(--t-base); z-index:2;
}
.icon-btn:hover { border-color:var(--gold); transform:rotate(180deg); }
.icon-btn.left  { left:14px; }
.icon-btn.right { right:14px; }
.icon-btn:active { transform:scale(.92) rotate(180deg); }

/* ═══════════ GROUP TITLE ═══════════ */
.group {
  position:relative; z-index:1;
  display:flex; align-items:center; gap:10px;
  margin:26px 4px 12px;
  font-size:.68rem; font-weight:900;
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--gold);
  opacity:0; animation:fade-in .5s ease forwards;
  cursor:pointer; user-select:none;
}
.group:hover { color:var(--gold-lt); }
.group .chev { transition:transform var(--t-base); font-size:.7rem; }
.group.collapsed .chev { transform:rotate(-90deg); }
.group::after {
  content:""; flex:1; height:1px;
  background:linear-gradient(90deg,var(--bd),transparent);
}
@keyframes fade-in { to{opacity:1} }
.group-body { display:contents; }
.group.collapsed + .group-body > * { display:none; }

/* ═══════════ BUTTON CARD ═══════════ */
.btn {
  position:relative; z-index:1;
  display:flex; align-items:center; gap:14px;
  width:100%; padding:14px 16px; margin-bottom:8px;
  background:linear-gradient(135deg, var(--bg-3), var(--bg-2));
  border:1.5px solid var(--bd); border-radius:var(--r-md);
  text-align:left; overflow:hidden;
  transition:all var(--t-base);
  animation:slide-up .4s ease-out backwards;
}
@keyframes slide-up { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
.btn::before {
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.14),transparent);
  transform:translateX(-100%); transition:transform .6s;
}
.btn:hover::before { transform:translateX(100%); }
.btn:hover {
  border-color:var(--gold); transform:translateY(-2px);
  box-shadow:var(--sh-gold);
}
.btn:active { transform:scale(.985); }
.btn:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
.btn[disabled] { opacity:.5; cursor:wait; pointer-events:none; }

.btn .ico {
  width:38px; height:38px; flex-shrink:0;
  display:grid; place-items:center; font-size:1.4rem;
  border-radius:10px; background:rgba(212,175,55,.1);
  transition:all var(--t-base);
}
.btn:hover .ico { background:rgba(212,175,55,.22); transform:scale(1.08) rotate(-5deg); }
.btn .lbl { flex:1; min-width:0; font-weight:700; font-size:.88rem; }
.btn .lbl small {
  display:block; font-size:.7rem; font-weight:400;
  color:var(--fg-2); margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.btn.primary {
  background:linear-gradient(135deg,var(--gold-lt),var(--gold) 55%,var(--gold-dk));
  color:#0a0a0a; border-color:var(--gold-lt); font-weight:900;
  box-shadow:var(--sh-gold);
}
.btn.primary:hover { box-shadow:0 14px 36px rgba(212,175,55,.5); }
.btn.primary .ico { background:rgba(0,0,0,.15); }
.btn.primary .lbl small { color:rgba(0,0,0,.65); }

.btn.danger  { background:linear-gradient(135deg,#2a1010,#1a0808); border-color:#4a2020; color:#fecaca; }
.btn.danger:hover  { border-color:var(--err); box-shadow:0 8px 24px rgba(248,113,113,.28); }
.btn.danger .ico  { background:rgba(248,113,113,.15); }

.btn.success { background:linear-gradient(135deg,#0f2a10,#081a08); border-color:#204a20; color:#bbf7d0; }
.btn.success:hover { border-color:var(--ok); box-shadow:0 8px 24px rgba(74,222,128,.28); }
.btn.success .ico { background:rgba(74,222,128,.15); }

.btn.info { background:linear-gradient(135deg,#0f1a2a,#081018); border-color:#20405a; color:#bfdbfe; }
.btn.info:hover { border-color:var(--info); box-shadow:0 8px 24px rgba(96,165,250,.28); }
.btn.info .ico { background:rgba(96,165,250,.15); }

/* ═══════════ PROGRESS ═══════════ */
.progress {
  display:none; align-items:center; gap:12px;
  padding:14px 16px; margin-bottom:12px;
  background:linear-gradient(135deg,var(--bg-2),var(--bg-3));
  border:1.5px solid var(--gold); border-radius:var(--r-md);
  font-size:.82rem; font-weight:600;
  position:relative; overflow:hidden; z-index:1;
}
.progress.on { display:flex; animation:slide-up .3s ease; }
.progress::after {
  content:""; position:absolute; bottom:0; left:0;
  height:2px; width:30%;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:loader 1.4s linear infinite;
}
@keyframes loader { 0%{left:-30%} 100%{left:100%} }
.spinner {
  width:18px; height:18px; flex-shrink:0;
  border:2px solid var(--bd); border-top-color:var(--gold);
  border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ═══════════ LOG ═══════════ */
.log-wrap { position:relative; z-index:1; margin-top:18px; }
.log-bar {
  display:flex; align-items:center; gap:8px;
  padding:10px 12px;
  background:var(--bg-2); border:1px solid var(--bd);
  border-bottom:none; border-radius:var(--r-md) var(--r-md) 0 0;
  font-size:.7rem; font-weight:700;
  color:var(--fg-2); letter-spacing:.08em; text-transform:uppercase;
  flex-wrap:wrap;
}
.log-bar .title { flex:1; min-width:80px; }
.log-bar .tools { display:flex; gap:6px; flex-wrap:wrap; }
.tool {
  padding:4px 9px; background:transparent;
  border:1px solid var(--bd); border-radius:6px;
  color:var(--fg-2); font-size:.64rem; font-weight:700;
  transition:all var(--t-fast); letter-spacing:.04em;
}
.tool:hover { border-color:var(--gold); color:var(--gold); }
.tool[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); background:rgba(212,175,55,.08); }

.log {
  background:#020204; border:1px solid var(--bd);
  border-radius:0 0 var(--r-md) var(--r-md);
  padding:14px; font:11.5px/1.7 var(--font-mono);
  color:#d4d4d4; white-space:pre-wrap; word-break:break-word;
  max-height:65dvh; overflow-y:auto; min-height:180px;
  position:relative; scroll-behavior:smooth;
}
.log .line {
  padding:1px 0; opacity:0;
  animation:line-in .3s ease forwards;
}
@keyframes line-in { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }
.log .line.hidden { display:none; }
.log .title {
  color:var(--gold); font-weight:800; font-size:12.5px;
  margin-top:10px; padding-top:8px; border-top:1px solid #1a1a1a;
  letter-spacing:.05em;
}
.log .title:first-child { margin-top:0; padding-top:0; border-top:none; }
.log .ok    { color:var(--ok); font-weight:700; }
.log .err   { color:var(--err); font-weight:700; }
.log .warn  { color:var(--warn); font-weight:700; }
.log .info  { color:var(--info); font-weight:700; }
.log .dim   { color:#6b6b6b; }
.log .purple{ color:var(--purple); font-weight:700; }
.log .cyan  { color:var(--cyan); font-weight:700; }
.log .box-err {
  display:block; padding:6px 10px; margin:4px 0;
  background:rgba(248,113,113,.15); color:var(--err); font-weight:800;
  border-left:3px solid var(--err); border-radius:6px;
}
.log .box-ok {
  display:block; padding:6px 10px; margin:4px 0;
  background:rgba(74,222,128,.12); color:var(--ok);
  border-left:3px solid var(--ok); border-radius:6px;
}
.log .box-info {
  display:block; padding:6px 10px; margin:4px 0;
  background:rgba(96,165,250,.12); color:var(--info);
  border-left:3px solid var(--info); border-radius:6px;
}
.log .box-warn {
  display:block; padding:6px 10px; margin:4px 0;
  background:rgba(251,191,36,.12); color:var(--warn);
  border-left:3px solid var(--warn); border-radius:6px;
}
.log .ctx {
  display:block; color:#8a8a8a; padding-left:12px;
  border-left:2px solid var(--bd);
}

/* ═══════════ MODAL ═══════════ */
.modal-bg {
  position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,.7); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center; padding:20px;
  animation:fade-in .2s ease;
}
.modal-bg.on { display:flex; }
.modal {
  width:100%; max-width:420px;
  background:var(--bg-2); border:1.5px solid var(--gold);
  border-radius:var(--r-lg); padding:22px;
  box-shadow:var(--sh-2);
  animation:pop .3s var(--t-spring);
}
@keyframes pop { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:none} }
.modal h3 { color:var(--gold); font-size:1rem; margin-bottom:12px; font-weight:900; }
.modal input {
  width:100%; padding:11px 13px; margin-bottom:14px;
  background:var(--bg-0); border:1.5px solid var(--bd);
  border-radius:var(--r-sm); color:var(--fg-1);
  transition:border-color var(--t-fast);
}
.modal input:focus { outline:none; border-color:var(--gold); }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; }
.modal-actions button {
  padding:9px 18px; border-radius:var(--r-sm);
  border:1.5px solid var(--bd); font-weight:700; font-size:.82rem;
  transition:all var(--t-fast);
}
.modal-actions .ok  { background:var(--gold); color:#0a0a0a; border-color:var(--gold-lt); }
.modal-actions .ok:hover { filter:brightness(1.1); }
.modal-actions .cancel:hover { border-color:var(--fg-2); }

/* ═══════════ TOASTS ═══════════ */
.toasts {
  position:fixed; top:16px; right:14px; z-index:2000;
  display:flex; flex-direction:column; gap:8px;
  pointer-events:none; max-width:min(340px,calc(100vw - 28px));
}
.toast {
  padding:12px 16px;
  background:linear-gradient(135deg,var(--bg-2),var(--bg-3));
  border:1.5px solid var(--gold); border-radius:var(--r-md);
  font-size:.82rem; font-weight:600; color:var(--fg-1);
  box-shadow:var(--sh-2);
  transform:translateX(140%); opacity:0;
  transition:all var(--t-spring);
  pointer-events:auto;
}
.toast.show { transform:translateX(0); opacity:1; }
.toast.ok  { border-color:var(--ok);   color:var(--ok); }
.toast.err { border-color:var(--err);  color:var(--err); }
.toast.warn{ border-color:var(--warn); color:var(--warn); }
.toast.info{ border-color:var(--info); color:var(--info); }

/* ═══════════ FOOTER ═══════════ */
.footer {
  position:relative; z-index:1; text-align:center;
  padding:26px 14px 14px; font-size:.66rem; color:var(--fg-3);
  letter-spacing:.14em; text-transform:uppercase; font-weight:700;
}
.footer b {
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* ═══════════ SCROLLBAR ═══════════ */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg-0); }
::-webkit-scrollbar-thumb { background:var(--bd); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--gold); }

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width:480px) {
  body { padding:12px 10px calc(50px + env(safe-area-inset-bottom)); }
  .header { padding:18px 12px 14px; }
  .header h1 { font-size:1.25rem; }
  .btn { padding:12px 14px; gap:12px; }
  .btn .ico { width:34px; height:34px; font-size:1.25rem; }
  .log { font-size:11px; padding:12px; }
}
.hidden { display:none !important; }
</style>
</head>
<body data-theme="dark">

<div class="stars" id="stars" aria-hidden="true"></div>

<header class="header">
  <button class="icon-btn left"  id="themeBtn" title="Тема" aria-label="Переключить тему">🌙</button>
  <button class="icon-btn right" id="resetBtn" title="Сбросить всё" aria-label="Сбросить состояние">↺</button>
  <h1>🔍 Artamon Debug</h1>
  <div class="version">Version 9.0 · Nova+</div>
  <div class="net-pill" role="status" aria-live="polite">
    <span class="dot" id="netDot"></span>
    <span id="netText">Проверка...</span>
  </div>
</header>

<main id="app" role="main"></main>

<footer class="footer">
  Powered by <b>Artamon v2.9</b> · Debug v9 Nova+
</footer>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal" id="modal">
    <h3 id="modalTitle">Ввод</h3>
    <input id="modalInput" type="text" autocomplete="off">
    <div class="modal-actions">
      <button class="cancel" id="modalCancel">Отмена</button>
      <button class="ok" id="modalOk">OK</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="region" aria-label="Уведомления" aria-live="polite"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   ARTAMON DEBUG v9 — Nova+
   Modern rewrite: async/await, fetch, registry-based tests
   ═══════════════════════════════════════════════════════════ */

// ─── CONFIG ───────────────────────────────────────────────
const CONFIG = Object.freeze({
  API_BASE: "https://artamon-api.artem123kv.workers.dev",
  GAME_FILE_CANDIDATES: [
    "./index_v4.html", "./index_v4.HTML",
    "./index.html", "./index.htm",
    "../index_v4.html", "../index.html",
    "/index_v4.html", "/index.html",
    "./game/index_v4.html", "./game/index.html",
    "./artamon/index_v4.html", "./artamon/index.html",
    "./src/index_v4.html", "./public/index_v4.html", "./dist/index_v4.html",
  ],
  HISTORY_KEY: "artamon_debug_v9_history",
  THEME_KEY: "artamon_debug_v9_theme",
  LOG_FILTER_KEY: "artamon_debug_v9_logfilter",
  FETCH_TIMEOUT: 12000,
  PING_COUNT: 5,
  MAX_HISTORY: 30,
});

// ─── SAFE TAGS (avoid breaking HTML when parsing) ────────
const TAG = Object.freeze({
  SCRIPT_OPEN: "<" + "script",
  SCRIPT_CLOSE: "<" + "/" + "script>",
  STYLE_OPEN: "<" + "style",
  STYLE_CLOSE: "<" + "/" + "style>",
});

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const State = {
  gamePath: null,
  gameContent: null,
  logFilter: "all",
  logSearch: "",
  collapsedGroups: new Set(),
};

// ═══════════════════════════════════════════════════════════
// DOM HELPERS
// ═══════════════════════════════════════════════════════════
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of children) {
    if (c == null) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
};

// ═══════════════════════════════════════════════════════════
// LOGGER
// ═══════════════════════════════════════════════════════════
const Logger = (() => {
  let root = null;
  const counts = { ok: 0, err: 0, warn: 0, info: 0, dim: 0, plain: 0 };

  const init = (el) => { root = el; };

  const LEVELS = new Set(["ok","err","warn","info","dim","title","error-line","success-line","info-line","warn-line","context-line"]);

  function write(text, level = "") {
    if (!root) return;
    const line = document.createElement("div");
    line.className = "line" + (level ? " " + level : "");
    line.textContent = text;
    line.dataset.level = normalizeLevel(level);
    root.appendChild(line);

    counts[normalizeLevel(level)] = (counts[normalizeLevel(level)] || 0) + 1;
    applyFilter(line);
    root.scrollTop = root.scrollHeight;
  }

  const normalizeLevel = (lvl) => {
    if (!lvl) return "plain";
    if (lvl === "title") return "title";
    if (lvl.includes("error")) return "err";
    if (lvl.includes("success") || lvl === "ok") return "ok";
    if (lvl.includes("warn")) return "warn";
    if (lvl.includes("info")) return "info";
    if (lvl === "dim" || lvl === "context-line") return "dim";
    return "plain";
  };

  function applyFilter(line) {
    if (!line) return;
    const lvl = line.dataset.level || "plain";
    const f = State.logFilter;
    const q = State.logSearch.toLowerCase();
    const text = (line.textContent || "").toLowerCase();

    let visible = true;
    if (f === "errors") visible = lvl === "err";
    else if (f === "warn") visible = lvl === "err" || lvl === "warn";
    else if (f === "ok") visible = lvl === "ok";
    if (visible && q) visible = text.includes(q);
    line.classList.toggle("hidden", !visible);
  }

  function refilter() {
    if (!root) return;
    $$(".line", root).forEach(applyFilter);
  }

  function clear() {
    if (!root) return;
    root.innerHTML = "";
    for (const k in counts) counts[k] = 0;
    write("🗑 Лог очищен", "dim");
  }

  const title = (t) => write("═══ " + t + " ═══", "title");
  const ok    = (t) => write(t, "ok");
  const err   = (t) => write(t, "err");
  const warn  = (t) => write(t, "warn");
  const info  = (t) => write(t, "info");
  const dim   = (t) => write(t, "dim");
  const blank = ()  => write("");
  const box   = (t, type) => write(t, {
    ok: "success-line", err: "error-line", warn: "warn-line", info: "info-line"
  }[type] || "info-line");
  const ctx   = (t) => write(t, "context-line");

  const counts$ = counts;
  const text = () => root ? (root.textContent || "") : "";

  return { init, write, clear, refilter, title, ok, err, warn, info, dim, blank, box, ctx, text, counts: counts$ };
})();

const Toast = (() => {
  let root;
  const init = (el) => { root = el; };
  function show(msg, type = "info", ttl = 3500) {
    if (!root) return;
    const node = el("div", { className: "toast " + type, role: "status" }, msg);
    root.append(node);

  }

})();

// ═══════════════════════════════════════════════════════════
// HTTP CLIENT (fetch + timeout + retry)
// ═══════════════════════════════════════════════════════════
const HTTP = {
  async request(url, { method = "GET", body, timeout = CONFIG.FETCH_TIMEOUT, signal } = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort("timeout"), timeout);
    if (signal) signal.addEventListener("abort", () => ctrl.abort(signal.reason));

    const opts = {
      method,
      signal: ctrl.signal,
      cache: "no-store",
    };
    if (body !== undefined) {
      opts.headers = { "Content-Type": "application/json" };
      opts.body = typeof body === "string" ? body : JSON.stringify(body);
    }

    const t0 = performance.now();
    try {
      const res = await fetch(url, opts);
      const ms = Math.round(performance.now() - t0);
      let data = null;
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) {
        try { data = await res.json(); } catch { data = null; }
      } else {
        try { data = await res.text(); } catch { data = null; }
      }
      return { ok: res.ok, status: res.status, data, ms, headers: res.headers };
    } catch (e) {
      const ms = Math.round(performance.now() - t0);
      const isAbort = e?.name === "AbortError" || String(e).includes("abort");
      return { ok: false, status: 0, data: null, ms, error: isAbort ? "timeout" : (e?.message || String(e)) };
    } finally {
      clearTimeout(timer);
    }
  },
  get(url, opts)  { return HTTP.request(url, { ...opts, method: "GET" }); },
  post(url, body, opts) { return HTTP.request(url, { ...opts, method: "POST", body }); },
};

// MODAL
// ═══════════════════════════════════════════════════════════
const Modal = (() => {
  let bg, input, titleEl, okBtn, cancelBtn;
  let currentResolve = null;

  const init = () => {
    bg = $("#modalBg"); input = $("#modalInput");
    titleEl = $("#modalTitle"); okBtn = $("#modalOk"); cancelBtn = $("#modalCancel");

    const close = (val) => {
      bg.classList.remove("on"); bg.setAttribute("aria-hidden", "true");
      input.value = "";
      const r = currentResolve; currentResolve = null;
      if (r) r(val);
    };

    okBtn.addEventListener("click", () => close(input.value));
    cancelBtn.addEventListener("click", () => close(null));
    bg.addEventListener("click", (e) => { if (e.target === bg) close(null); });
    bg.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); close(input.value); }
      else if (e.key === "Escape") { e.preventDefault(); close(null); }
    });
  };

  function open(title, { value = "", placeholder = "" } = {}) {
    return new Promise((resolve) => {
      currentResolve = resolve;
      titleEl.textContent = title;
      input.value = value;
      input.placeholder = placeholder;
      bg.classList.add("on");
      bg.setAttribute("aria-hidden", "false");
      setTimeout(() => input.focus(), 40);
    });
  }

  function confirm(title) {
    return new Promise((resolve) => {
      currentResolve = resolve;
      titleEl.textContent = title;
      input.value = "";
      input.placeholder = "(нажми OK для подтверждения)";
      input.style.display = "none";
      bg.classList.add("on");
      bg.setAttribute("aria-hidden", "false");
      setTimeout(() => okBtn.focus(), 40);
      const restore = () => { input.style.display = ""; okBtn.removeEventListener("click", restore); };
      okBtn.addEventListener("click", restore, { once: true });
    }).then((v) => v !== null);
  }

  return { init, open, confirm };
})();

// GAME FILE LOADER
// ═══════════════════════════════════════════════════════════
const GameFile = {
  async find(signal) {
    for (const path of CONFIG.GAME_FILE_CANDIDATES) {
      if (signal?.aborted) return null;
      try {
        const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store", signal });
        if (res.ok) return path;
      } catch (e) { if (signal?.aborted) return null; }
    }
    return null;
  },

  async load({ signal } = {}) {
    if (State.gameContent) return { content: State.gameContent, path: State.gamePath };
    if (!State.gamePath) {
      Progress.show("🔍 Ищу файл игры...");
      State.gamePath = await GameFile.find(signal);
      Progress.hide();
      if (!State.gamePath) return null;
    }
    try {
      const res = await fetch(State.gamePath + "?t=" + Date.now(), { cache: "no-store", signal });
      if (!res.ok) return null;
      State.gameContent = await res.text();
      return { content: State.gameContent, path: State.gamePath };
    } catch { return null; }
  },

  reset() {
    State.gamePath = null;
    State.gameContent = null;
  },
};

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
const Utils = {
  bytes(n) { return n.toLocaleString("ru-RU"); },
  pct(a, b) { return Math.round((a / b) * 100); },
  pad(s, n, c = " ") { return String(s).padEnd(n, c); },
  padNum(n, w) { return String(n).padStart(w, " "); },
  bar(n, max, width = 30) {
    const fill = Math.max(1, Math.min(width, Math.round((n / Math.max(1, max)) * width)));
    return "█".repeat(fill);
  },
  debounce(fn, ms = 150) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  },
  escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  },
  splitScripts(html) {
    return html.split(TAG.SCRIPT_OPEN + ">").slice(1).map(p => p.split(TAG.SCRIPT_CLOSE)[0] || "");
  },
  splitStyles(html) {
    const re = new RegExp(TAG.STYLE_OPEN + "[^>]*>([\\s\\S]*?)" + TAG.STYLE_CLOSE, "g");
    const out = [];
    let m;
    while ((m = re.exec(html)) !== null) out.push(m[1]);
    return out;
  },
  async withGameFile(handler) {
    Progress.show("🔍 Загружаю файл...");
    const loaded = await GameFile.load();
    Progress.hide();
    if (!loaded) {
      Logger.err("❌ Файл игры НЕ найден ни по одному пути");
      Logger.blank();
      Logger.warn("Проверенные пути:");
      CONFIG.GAME_FILE_CANDIDATES.forEach(p => Logger.dim("  " + p));
      Toast.show("Файл игры не найден", "err");
      return;
    }
    Logger.ok("✅ Найден: " + loaded.path);
    Logger.dim("📄 Размер: " + Utils.bytes(loaded.content.length) + " симв., строк: " + loaded.content.split("\n").length);
    Logger.blank();
    await handler(loaded.content, loaded.path);
  },
};

// ═══════════════════════════════════════════════════════════
// BINARY SEARCH for first invalid line in JS
// ═══════════════════════════════════════════════════════════
function findFirstInvalidLine(code) {
  const lines = code.split("\n");
  const total = lines.length;
  if (!total) return 0;
  let lo = 1, hi = total, firstInvalid = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const test = lines.slice(0, mid).join("\n");
    let valid = false;
    try { new Function(test); valid = true; } catch {}
    if (valid) lo = mid + 1;
    else { firstInvalid = mid; hi = mid - 1; }
  }
  return firstInvalid || 1;
}

      const a = el("a", { href: url, download: `artamon-debug-${new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19)}.txt` });
      document.body.append(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      Logger.ok("📤 Лог скачан");
      Toast.show("Лог скачан", "ok");
    },
  },
  {
    id: "exportJSON", group: "⚙️ Действия", icon: "🧾", color: "info",
    title: "Экспорт лога (JSON)", subtitle: "Структурированный .json",
    async run() {
      History.add("Экспорт JSON");
      const lines = $$(".line", $("#out")).map(l => ({
        level: l.dataset.level || "plain",
        text: l.textContent,
      }));
      const payload = {
        generator: "Artamon Debug v9",
        timestamp: new Date().toISOString(),
        url: location.href,
        ua: navigator.userAgent,
        counts: Logger.counts,
        lines,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: `artamon-debug-${Date.now()}.json` });
      document.body.append(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      Toast.show("JSON скачан", "ok");
    },
  },
  {
    id: "history", group: "⚙️ Действия", icon: "📜", color: "info",
    title: "История действий", subtitle: "Что делал в Debug",
    async run() {
      Logger.title("ИСТОРИЯ ДЕЙСТВИЙ");
      History.add("Просмотр истории");
      const h = History.list();
      if (!h.length) { Logger.dim("История пуста"); return; }
      h.forEach(item => {
        Logger.info(new Date(item.ts).toLocaleString("ru-RU") + "  ·  " + item.action);
      });
    },
  },
  {
    id: "clearSW", group: "⚙️ Действия", icon: "🧹", color: "danger",
    title: "Очистить кэш (SW)", subtitle: "Service Worker + Cache",
    async run() {
      Logger.title("ОЧИСТКА КЭША");
      History.add("Очистка кэша");
      if (!("serviceWorker" in navigator)) {
        Logger.warn("⚠️ Service Worker не поддерживается");
        Toast.show("SW не поддерживается", "warn");
        return;
      }
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        Logger.info("Найдено SW: " + regs.length);
        await Promise.all(regs.map(r => r.unregister()));
        Logger.ok("✅ Service Workers удалены");

        if ("caches" in window) {
          const names = await caches.keys();
          Logger.info("Найдено кэшей: " + names.length);
          await Promise.all(names.map(n => caches.delete(n)));
          Logger.ok("✅ Кэши удалены");
        }
        Logger.blank();
        Logger.info("💡 Перезагрузи страницу для применения");
        Toast.show("Кэш очищен", "ok");
      } catch (e) {
        Logger.err("❌ " + e.message);
        Toast.show("Ошибка", "err");
      }
    },
  },
  {
    id: "hardReset", group: "⚙️ Действия", icon: "💣", color: "danger",
    title: "Полный сброс localStorage", subtitle: "Осторожно: удалит сохранения",
    async run() {
      if (!await Modal.confirm("Удалить ВСЁ из localStorage?\nЭто сотрёт сохранения, темы и настройки.")) return;
      if (!await Modal.confirm("Точно? Действие необратимо!")) return;
      Logger.title("ПОЛНЫЙ СБРОС");
      History.add("Hard reset");
      try {
        const n = localStorage.length;
        localStorage.clear();
        Logger.ok("✅ Удалено ключей: " + n);
        Logger.info("💡 Обнови страницу");
        Toast.show("Удалено ключей: " + n, "ok");
      } catch (e) {
        Logger.err("❌ " + e.message);
        Toast.show("Ошибка", "err");
      }
    },
  },
  {
    id: "clearLog", group: "⚙️ Действия", icon: "🗑",
    title: "Очистить лог", subtitle: "Стереть вывод",
    async run() { Logger.clear(); },
  },
];

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function buildUI() {
  const app = $("#app");
  app.innerHTML = "";

  // Group tests
  const groups = new Map();
  for (const t of TESTS) {
    if (!groups.has(t.group)) groups.set(t.group, []);
    groups.get(t.group).push(t);
  }

  for (const [groupName, tests] of groups) {
    const collapsed = State.collapsedGroups.has(groupName);
    const groupHead = el("div", {
      className: "group" + (collapsed ? " collapsed" : ""),
      role: "button", tabIndex: 0,
      "aria-expanded": String(!collapsed),
    });
    groupHead.append(
      el("span", { className: "chev" }, "▾"),
      document.createTextNode(groupName),
    );
    groupHead.addEventListener("click", () => toggleGroup(groupName, groupHead));
    groupHead.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleGroup(groupName, groupHead); }
    });
    app.append(groupHead);

    const body = el("div", { className: "group-body" });
    tests.forEach((t, i) => {
      const btn = el("button", {
        className: "btn" + (t.color ? " " + t.color : ""),
        type: "button",
        dataset: { testId: t.id },
        style: `animation-delay:${i * 0.03}s`,
      });
      btn.append(
        el("span", { className: "ico", "aria-hidden": "true" }, t.icon),
        el("span", { className: "lbl" }, t.title, el("small", {}, t.subtitle)),
      );
      body.append(btn);
    });
    app.append(body);
  }

  // Progress
  const progress = el("div", { className: "progress", id: "progress", role: "status", "aria-live": "polite" });
  progress.append(
    el("div", { className: "spinner", "aria-hidden": "true" }),
    el("span", { id: "progressText" }, "Работаю..."),
  );
  app.append(progress);

  // Log wrap
  const logWrap = el("div", { className: "log-wrap" });
  const logBar = el("div", { className: "log-bar" });
  logBar.append(
    el("span", { className: "title" }, "📋 Лог"),
    (() => {
      const tools = el("div", { className: "tools" });
      const mk = (label, action, pressed) => {
        const b = el("button", { className: "tool", type: "button" }, label);
        if (pressed !== undefined) b.setAttribute("aria-pressed", String(pressed));
        b.addEventListener("click", action);
        return b;
      };
      tools.append(
        mk("Все", () => setLogFilter("all"), true),
        mk("Ошибки", () => setLogFilter("errors"), false),
        mk("Warn+", () => setLogFilter("warn"), false),
        mk("OK", () => setLogFilter("ok"), false),
        mk("📋 Копировать", copyLog),
        mk("⬆", () => { $("#out").scrollTop = 0; }),
        mk("⬇", () => { const o = $("#out"); o.scrollTop = o.scrollHeight; }),
      );
      return tools;
    })(),
  );
  const out = el("div", { className: "log", id: "out", role: "log", "aria-live": "polite" });
  logWrap.append(logBar, out);
  app.append(logWrap);

  Logger.init(out);
}

function toggleGroup(name, head) {
  const collapsed = State.collapsedGroups.has(name);
  if (collapsed) State.collapsedGroups.delete(name);
  else State.collapsedGroups.add(name);
  head.classList.toggle("collapsed", !collapsed);
  head.setAttribute("aria-expanded", String(collapsed));
}

function setLogFilter(filter) {
  State.logFilter = filter;
  $$(".tool").forEach(b => {
    const label = b.textContent.trim();
    const map = { "Все": "all", "Ошибки": "errors", "Warn+": "warn", "OK": "ok" };
    if (map[label] !== undefined) b.setAttribute("aria-pressed", String(map[label] === filter));
  });
  Logger.refilter();
}

function copyLog() {
  const text = Logger.text();
  if (!text) { Toast.show("Лог пуст", "warn"); return; }
  navigator.clipboard.writeText(text)
    .then(() => Toast.show("📋 Скопировано", "ok"))
    .catch(() => Toast.show("❌ Не удалось", "err"));
}

// ═══════════════════════════════════════════════════════════
// EVENT DELEGATION
// ═══════════════════════════════════════════════════════════
let running = false;

function attachTestHandlers() {
  $("#app").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-test-id]");
    if (!btn) return;
    if (running) { Toast.show("Уже выполняется...", "warn"); return; }

    const test = TESTS.find(t => t.id === btn.dataset.testId);
    if (!test) return;

    running = true;
    btn.disabled = true;
    btn.style.opacity = ".6";

    // Reset scroll to top of log
    const out = $("#out");
    out.scrollTop = 0;

    // Separator
    Logger.write("");

    try {
      await test.run();
    } catch (e) {
      Logger.err("❌ Ошибка выполнения теста: " + (e?.message || e));
      console.error(e);
    } finally {
      running = false;
      btn.disabled = false;
      btn.style.opacity = "";
    }
  });
}

// ═══════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════
function applyTheme(theme) {
  document.body.setAttribute("data-theme", theme);
  try { localStorage.setItem(CONFIG.THEME_KEY, theme); } catch {}
  const btn = $("#themeBtn");
  if (btn) btn.textContent = theme === "light" ? "☀️" : "🌙";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#f8fafc" : "#0a0a10");
}

function toggleTheme() {
  const cur = document.body.getAttribute("data-theme");
  applyTheme(cur === "light" ? "dark" : "light");
  Toast.show("Тема: " + (cur === "light" ? "Тёмная" : "Светлая"), "info");
}

// ═══════════════════════════════════════════════════════════
// NET STATUS
// ═══════════════════════════════════════════════════════════
function updateNetStatus() {
  const dot = $("#netDot"), txt = $("#netText");
  if (navigator.onLine) { dot.className = "dot on";  txt.textContent = "Онлайн"; }
  else                  { dot.className = "dot off"; txt.textContent = "Офлайн"; }
}

// ═══════════════════════════════════════════════════════════
// STARFIELD
// ═══════════════════════════════════════════════════════════
function createStars(count = 40) {
  const c = $("#stars");
  if (!c) return;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const s = el("div", { className: "star" });
    s.style.left = Math.random() * 100 + "%";
    s.style.top  = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 4) + "s";
    s.style.animationDuration = (3 + Math.random() * 3) + "s";
    frag.append(s);
  }
  c.append(frag);
}

// ═══════════════════════════════════════════════════════════
// GLOBAL ERROR HANDLERS
// ═══════════════════════════════════════════════════════════
window.addEventListener("error", (e) => {
  Logger.write("❗ Uncaught: " + (e.message || e.error) + " @ " +
    (e.filename || "?") + ":" + (e.lineno || "?"), "err");
});
window.addEventListener("unhandledrejection", (e) => {
  const msg = e.reason?.message || e.reason || "(unknown)";
  Logger.write("❗ Promise rejection: " + msg, "err");
});

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
(function boot() {
  // Init modules first
  Modal.init();
  Progress.init();
  Toast.init($("#toasts"));

  // Build UI (this also inits Logger)
  buildUI();
  attachTestHandlers();

  // Theme
  let savedTheme = "dark";
  try { savedTheme = localStorage.getItem(CONFIG.THEME_KEY) || "dark"; } catch {}
  applyTheme(savedTheme);
  $("#themeBtn").addEventListener("click", toggleTheme);
  $("#resetBtn").addEventListener("click", async () => {
    if (!await Modal.confirm("Сбросить состояние Debug? Файл игры будет перезагружен.")) return;
    GameFile.reset();
    State.collapsedGroups.clear();
    localStorage.removeItem(CONFIG.HISTORY_KEY);
    Toast.show("Состояние сброшено", "ok");
    buildUI();
    attachTestHandlers();
    greet();
  });

  // Net status
  updateNetStatus();
  window.addEventListener("online",  updateNetStatus);
  window.addEventListener("offline", updateNetStatus);

  // Stars
  createStars(40);

  // Greeting
  greet();
})();

function greet() {
  Logger.ok("✅ Artamon Debug v9 Nova+ загружен");
  Logger.info("🔍 Автопоиск файла игры готов");
  Logger.warn("⚠️ /api/tech-status НЕ вызывается (защита от tech.html)");
  Logger.blank();
  Logger.dim("Подсказка: нажми любую кнопку выше.");
  Logger.blank();
  Logger.dim("Проверяемые пути к файлу игры:");
  CONFIG.GAME_FILE_CANDIDATES.forEach(p => Logger.dim("  " + p));
}
</script>
