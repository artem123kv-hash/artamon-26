<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚨 Отключить техрежим</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: #0a0a10;
  color: #e8e8f0;
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image: radial-gradient(circle at 50% 50%, rgba(248,113,113,.1), transparent 60%);
}
.box {
  max-width: 460px;
  width: 100%;
  background: linear-gradient(180deg, #12121a, #0a0a10);
  border: 2px solid #d4af37;
  border-radius: 20px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.icon {
  font-size: 4rem;
  display: block;
  margin-bottom: 16px;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
h1 {
  font-size: 1.4rem;
  color: #f6e6a8;
  margin-bottom: 8px;
  letter-spacing: .04em;
}
.sub {
  font-size: .85rem;
  color: #8888a0;
  margin-bottom: 24px;
  line-height: 1.6;
}
.status {
  padding: 12px 16px;
  background: #1a1a24;
  border: 1px solid #252532;
  border-radius: 10px;
  font-size: .82rem;
  margin-bottom: 18px;
  font-family: ui-monospace, monospace;
  color: #8888a0;
  text-align: left;
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 40px;
}
.status.ok { color: #4ade80; border-color: rgba(74,222,128,.4); }
.status.err { color: #f87171; border-color: rgba(248,113,113,.4); }
.status.warn { color: #fbbf24; border-color: rgba(251,191,36,.4); }
button {
  width: 100%;
  padding: 16px;
  margin-bottom: 10px;
  border-radius: 12px;
  font-family: inherit;
  font-size: .95rem;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: .2s;
  border: 2px solid transparent;
}
.btn-off {
  background: linear-gradient(180deg, #f6e6a8, #d4af37);
  color: #0a0a0a;
  border-color: #f6e6a8;
}
.btn-off:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,175,55,.4); }
.btn-check {
  background: transparent;
  color: #60a5fa;
  border-color: #60a5fa;
}
.btn-check:hover { background: rgba(96,165,250,.1); }
button:disabled { opacity: .5; cursor: not-allowed; }
.hint {
  font-size: .7rem;
  color: #555568;
  margin-top: 16px;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="box">
  <span class="icon">🚨</span>
  <h1>Отключить техрежим</h1>
  <div class="sub">
    Аварийный выключатель.<br>
    Используй, если не можешь войти в админку.
  </div>

  <div class="status" id="status">Проверяю текущий статус...</div>

  <button class="btn-check" id="checkBtn" onclick="checkStatus()">🔍 Проверить статус</button>
  <button class="btn-off" id="offBtn" onclick="turnOff()">🚨 ВЫКЛЮЧИТЬ ТЕХРЕЖИМ</button>

  <div class="hint">
    Пароль: artamon-admin-2026 (жёстко зашит)<br>
    После выключения — обнови админку
  </div>
</div>

<script>
var API = "https://artamon-api.artem123kv.workers.dev";
var ADMIN_PASS = "artamon-admin-2026";

var statusEl = document.getElementById("status");
var offBtn = document.getElementById("offBtn");
var checkBtn = document.getElementById("checkBtn");

function setStatus(text, cls) {
  statusEl.className = "status " + (cls || "");
  statusEl.textContent = text;
}

async function checkStatus() {
  setStatus("Проверяю...", "");
  try {
    var r = await fetch(API + "/api/tech-status?t=" + Date.now());
    var d = await r.json();
    if (d.tech) {
      setStatus("⚠️ ТЕХРЕЖИМ ВКЛЮЧЁН\n\nСообщение: " + (d.message || "—") + "\nВключён: " + (d.enabledAt ? new Date(d.enabledAt).toLocaleString("ru-RU") : "—"), "warn");
    } else {
      setStatus("✅ Техрежим выключен\n\nИгра и админки должны работать.", "ok");
    }
  } catch(e) {
    setStatus("❌ Ошибка: " + e.message, "err");
  }
}

async function turnOff() {
  offBtn.disabled = true;
  checkBtn.disabled = true;
  setStatus("Отправляю запрос...", "");

  try {
    var r = await fetch(API + "/api/admin/tech-toggle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: ADMIN_PASS,
        enable: false
      })
    });
    var d = await r.json();

    if (d.ok && d.tech === false) {
      setStatus("✅ ТЕХРЕЖИМ ВЫКЛЮЧЕН!\n\nМожно обновлять админку и игру.", "ok");
      offBtn.textContent = "✅ ВЫКЛЮЧЕНО";
    } else if (d.error) {
      setStatus("❌ Ошибка: " + d.error, "err");
      offBtn.disabled = false;
    } else {
      setStatus("⚠️ Ответ: " + JSON.stringify(d), "warn");
      offBtn.disabled = false;
    }
  } catch(e) {
    setStatus("❌ Ошибка сети: " + e.message, "err");
    offBtn.disabled = false;
  } finally {
    checkBtn.disabled = false;
  }
}

// Автопроверка при загрузке
checkStatus();
</script>
</body>
</html>
