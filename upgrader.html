<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d4af37">
<title>🎰 Artamon Upgrader</title>
<style>
:root {
  --bg-0: #050507; --bg-1: #0a0a12; --bg-2: #12121c; --bg-3: #1a1a28;
  --card: rgba(18,18,28,.85); --card-2: rgba(10,10,18,.95);
  --border: #252535; --border-gold: rgba(212,175,55,.4);
  --txt-1: #e8e8f0; --txt-2: #8888a0; --txt-3: #555568;
  --gold: #d4af37; --gold-bright: #f6e6a8; --gold-dark: #8f6f1a;
  --ok: #4ade80; --err: #f87171; --warn: #fbbf24; --info: #60a5fa;
  --common: #8a8a9a; --rare: #4a90e2; --epic: #a855f7; --legendary: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100vh; background: var(--bg-0); color: var(--txt-1);
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  line-height: 1.5; overflow-x: hidden;
}
body {
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(212,175,55,.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 100%, rgba(74,144,226,.08) 0%, transparent 45%);
  background-attachment: fixed; padding-bottom: 40px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; font-size: 16px; }
.hidden { display: none !important; }
#app { position: relative; z-index: 1; }

.topbar {
  position: sticky; top: 0; z-index: 100;
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  padding: 12px 16px;
  background: linear-gradient(180deg, rgba(5,5,7,.98), rgba(5,5,7,.85));
  backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
}
.topbar-logo {
  display: flex; align-items: center; gap: 8px; font-size: 1.15rem; font-weight: 900;
  letter-spacing: .08em;
  background: linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, var(--gold-dark));
  -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap;
}
.topbar-logo .spin-emoji { font-size: 1.5rem; display: inline-block; animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.topbar-center { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.topbar-stat {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  font-size: .74rem; color: var(--txt-2);
}
.topbar-stat b { color: var(--gold-bright); font-weight: 800; }
.topbar-right { display: flex; gap: 8px; align-items: center; }
.balance-box {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px;
  background: linear-gradient(180deg, rgba(212,175,55,.18), rgba(212,175,55,.05));
  border: 1.5px solid var(--border-gold); border-radius: 12px; font-weight: 900;
  color: var(--gold-bright); white-space: nowrap; transition: .3s;
}
.balance-box.updating { transform: scale(1.08); box-shadow: 0 0 40px rgba(212,175,55,.3); }
.balance-box .num { font-family: ui-monospace, monospace; font-size: .95rem; }
.user-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; font-weight: 900; color: #0a0a0a;
  border: 2px solid var(--gold-bright); box-shadow: 0 0 20px rgba(212,175,55,.4);
  cursor: pointer;
}

.navbar {
  display: flex; gap: 6px; padding: 8px 16px;
  background: var(--bg-1); border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
  position: sticky; top: 65px; z-index: 99;
}
.navbar::-webkit-scrollbar { display: none; }
.nav-btn {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-radius: 10px; font-size: .82rem; font-weight: 800; letter-spacing: .06em;
  color: var(--txt-2); white-space: nowrap; transition: .2s;
  border: 1.5px solid transparent; cursor: pointer; user-select: none;
}
.nav-btn:hover { color: var(--txt-1); background: rgba(255,255,255,.03); }
.nav-btn.active {
  color: var(--gold-bright);
  background: linear-gradient(180deg, rgba(212,175,55,.2), rgba(212,175,55,.05));
  border-color: var(--border-gold);
}
.nav-btn .badge {
  padding: 2px 7px; background: var(--gold); color: #0a0a0a;
  border-radius: 8px; font-size: .65rem; font-weight: 900;
  font-family: ui-monospace, monospace;
}

.container { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
.tab-content { display: none; animation: fade-up .35s ease; }
.tab-content.active { display: block; }
@keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* UPGRADE STAGE */
.upgrade-stage {
  display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 16px; align-items: center;
  padding: 24px 20px;
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 1.5px solid var(--border); border-radius: 20px; margin-bottom: 16px;
  position: relative; overflow: hidden;
}
@media (max-width: 720px) { .upgrade-stage { grid-template-columns: 1fr; } }

.slot {
  position: relative;
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 2px dashed var(--border); border-radius: 16px;
  padding: 16px 12px; min-height: 160px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 6px; transition: .3s; cursor: pointer; overflow: hidden;
  user-select: none;
}
.slot:hover { border-color: var(--gold); transform: translateY(-2px); }
.slot.filled { border-style: solid; border-color: var(--gold);
  background: linear-gradient(180deg, rgba(212,175,55,.08), var(--bg-2)); }
.slot.filled.rarity-common { border-color: var(--common); }
.slot.filled.rarity-rare { border-color: var(--rare); box-shadow: 0 0 30px rgba(74,144,226,.3); }
.slot.filled.rarity-epic { border-color: var(--epic); box-shadow: 0 0 30px rgba(168,85,247,.4); }
.slot.filled.rarity-legendary { border-color: var(--legendary); box-shadow: 0 0 40px rgba(245,158,11,.5); }

.slot-hint { font-size: .66rem; color: var(--txt-3); letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
.slot-empty-icon { font-size: 2.4rem; opacity: .3; transition: .3s; }
.slot:hover .slot-empty-icon { opacity: .6; transform: scale(1.1); }
.slot-icon { font-size: 3.5rem; line-height: 1; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.slot-name { font-size: .85rem; font-weight: 800; color: var(--txt-1);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-price { font-size: .78rem; color: var(--txt-2); font-weight: 700;
  font-family: ui-monospace, monospace; }
.slot-price .coin { color: var(--gold); }
.slot-rarity-tag { display: inline-block; padding: 2px 8px; border-radius: 6px;
  font-size: .58rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.r-common { color: var(--common); background: rgba(138,138,154,.15); }
.r-rare { color: var(--rare); background: rgba(74,144,226,.15); }
.r-epic { color: var(--epic); background: rgba(168,85,247,.15); }
.r-legendary { color: var(--legendary); background: rgba(245,158,11,.15); }

.slot-remove {
  position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
  border-radius: 50%; background: rgba(248,113,113,.2); color: var(--err);
  font-size: 1rem; font-weight: 900; display: flex; align-items: center;
  justify-content: center; transition: .2s; cursor: pointer;
}
.slot-remove:hover { background: var(--err); color: white; transform: scale(1.1); }

.circle-wrap {
  position: relative; width: 240px; height: 240px; margin: 0 auto;
  filter: drop-shadow(0 0 30px rgba(212,175,55,.2));
}
.circle-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.circle-bg { fill: none; stroke: rgba(255,255,255,.04); stroke-width: 16; }
.circle-track { fill: none; stroke: rgba(248,113,113,.35); stroke-width: 16; }
.circle-win { fill: none; stroke: url(#winGradient); stroke-width: 16;
  stroke-linecap: butt; transition: stroke-dasharray .5s ease;
  filter: drop-shadow(0 0 12px var(--ok)); }
.circle-tick { stroke: rgba(255,255,255,.12); stroke-width: 2; }
.circle-tick.major { stroke: rgba(212,175,55,.4); stroke-width: 3; }
.circle-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; pointer-events: none;
}
.circle-chance {
  font-size: 2.8rem; font-weight: 900; color: var(--ok);
  line-height: 1; font-family: ui-monospace, monospace;
  text-shadow: 0 0 30px rgba(74,222,128,.5); transition: color .3s;
}
.circle-chance.low { color: var(--err); }
.circle-chance.mid { color: var(--warn); }
.circle-chance.high { color: var(--ok); }
.circle-label { font-size: .65rem; color: var(--txt-2); letter-spacing: .2em;
  text-transform: uppercase; font-weight: 800; margin-top: 6px; }
.circle-payout { font-size: .82rem; color: var(--gold-bright); font-weight: 800;
  margin-top: 4px; font-family: ui-monospace, monospace; }
.circle-pointer {
  position: absolute;
  bottom: -12px;
  left: 50%;
  font-size: 1.8rem;
  filter: drop-shadow(0 0 12px var(--gold));
  z-index: 5;
  pointer-events: none;
  color: var(--gold);
  transform-origin: 50% -108px;
}
.circle-pointer.spinning { transition: transform 4.5s cubic-bezier(.15, .85, .25, 1); }
.circle-pointer.win { color: var(--ok); }
.circle-pointer.lose { color: var(--err); }

.mult-section {
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 1.5px solid var(--border); border-radius: 16px;
  padding: 16px; margin-bottom: 16px;
}
.mult-label { font-size: .7rem; color: var(--txt-2); letter-spacing: .12em;
  text-transform: uppercase; font-weight: 800; margin-bottom: 10px; }
.mult-presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
  gap: 6px; margin-bottom: 14px; }
.mult-btn {
  padding: 10px 8px; background: var(--bg-2); border: 1.5px solid var(--border);
  border-radius: 10px; font-size: .82rem; font-weight: 900;
  font-family: ui-monospace, monospace; color: var(--txt-2); transition: .2s;
  cursor: pointer; user-select: none;
}
.mult-btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
.mult-btn.active {
  background: linear-gradient(180deg, rgba(212,175,55,.25), rgba(212,175,55,.08));
  border-color: var(--gold-bright); color: var(--gold-bright);
}
.slider-wrap { position: relative; margin-top: 4px; }
.mult-slider {
  width: 100%; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--err) 0%, var(--warn) 50%, var(--ok) 100%);
  outline: none; -webkit-appearance: none; appearance: none; cursor: pointer;
}
.mult-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--gold-bright), var(--gold) 70%, var(--gold-dark));
  cursor: pointer; box-shadow: 0 0 16px rgba(212,175,55,.8);
  border: 2px solid var(--gold-bright);
}
.mult-slider::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--gold-bright), var(--gold) 70%, var(--gold-dark));
  cursor: pointer; box-shadow: 0 0 16px rgba(212,175,55,.8);
  border: 2px solid var(--gold-bright);
}
.slider-value {
  position: absolute; top: -32px; transform: translateX(-50%);
  padding: 2px 10px; background: var(--gold); color: #0a0a0a;
  border-radius: 8px; font-size: .72rem; font-weight: 900;
  font-family: ui-monospace, monospace; white-space: nowrap;
  transition: left .15s; pointer-events: none;
}
.slider-value::after {
  content: ""; position: absolute; bottom: -4px; left: 50%;
  transform: translateX(-50%) rotate(45deg); width: 8px; height: 8px; background: var(--gold);
}

.spin-btn {
  position: relative; width: 100%; padding: 20px; border-radius: 16px;
  font-size: 1.05rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
  background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 40%, var(--gold-dark) 100%);
  color: #0a0a0a; border: 2px solid var(--gold-bright);
  box-shadow: 0 10px 40px rgba(212,175,55,.4);
  transition: .25s; overflow: hidden; display: flex; align-items: center;
  justify-content: center; gap: 12px; cursor: pointer; user-select: none;
}
.spin-btn:hover:not(:disabled) { transform: translateY(-3px);
  box-shadow: 0 16px 50px rgba(212,175,55,.6); }
.spin-btn:active:not(:disabled) { transform: scale(.98); }
.spin-btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }
.spin-btn .icon { font-size: 1.5rem; }

.result-overlay {
  position: fixed; inset: 0; z-index: 500; display: none;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,0,0,.88); backdrop-filter: blur(12px);
}
.result-overlay.on { display: flex; animation: fade-in .3s ease; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.result-card {
  max-width: 420px; width: 100%; padding: 40px 28px;
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 3px solid var(--gold); border-radius: 24px; text-align: center;
  position: relative; overflow: hidden; animation: pop-in .5s cubic-bezier(.5, 1.5, .5, 1);
}
@keyframes pop-in { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-card.win { border-color: var(--ok); box-shadow: 0 0 100px rgba(74,222,128,.6); }
.result-card.lose { border-color: var(--err); box-shadow: 0 0 100px rgba(248,113,113,.6); }
.result-card.jackpot { border-color: var(--legendary);
  box-shadow: 0 0 140px rgba(245,158,11,.8);
  animation: pop-in .5s cubic-bezier(.5, 1.5, .5, 1), jackpot-glow 1.5s ease infinite alternate; }
@keyframes jackpot-glow { from { box-shadow: 0 0 100px rgba(245,158,11,.6); }
  to { box-shadow: 0 0 160px rgba(245,158,11,1); } }
.result-emoji { font-size: 6rem; display: block; margin-bottom: 18px; line-height: 1;
  filter: drop-shadow(0 0 40px currentColor); }
.result-emoji.win { color: var(--ok); animation: bounce .7s ease; }
.result-emoji.lose { color: var(--err); animation: shake .7s ease; }
.result-emoji.jackpot { color: var(--legendary); animation: bounce .7s ease, pulse-glow 1s infinite; }
@keyframes bounce { 0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-40px) scale(1.4); }
  60% { transform: translateY(0) scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-16px) rotate(-6deg); }
  40% { transform: translateX(16px) rotate(6deg); } }
@keyframes pulse-glow { 0%, 100% { filter: drop-shadow(0 0 30px currentColor); }
  50% { filter: drop-shadow(0 0 70px currentColor); } }
.result-title { font-size: 1.8rem; font-weight: 900; letter-spacing: .08em;
  text-transform: uppercase; margin-bottom: 12px; }
.result-title.win { color: var(--ok); }
.result-title.lose { color: var(--err); }
.result-title.jackpot { background: linear-gradient(180deg, #fef3c7, var(--legendary));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.result-sub { font-size: .95rem; color: var(--txt-2); margin-bottom: 22px; line-height: 1.5; }
.result-reward {
  padding: 18px; background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 20px; display: flex;
  align-items: center; justify-content: center; gap: 14px;
  font-size: 1.2rem; font-weight: 900; font-family: ui-monospace, monospace;
}
.result-reward .icon { font-size: 2rem; }
.result-reward .green { color: var(--ok); }
.result-reward .red { color: var(--err); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti-piece { position: absolute; width: 10px; height: 16px; top: -20px;
  animation: confetti-fall 3.5s linear forwards; }
@keyframes confetti-fall { to { transform: translateY(700px) rotate(900deg); opacity: 0; } }

.quick-bets {
  display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
  padding: 10px 12px; background: var(--bg-2);
  border: 1px solid var(--border); border-radius: 12px; align-items: center;
}
.quick-bets-label { font-size: .68rem; color: var(--txt-3);
  letter-spacing: .1em; text-transform: uppercase; font-weight: 800; margin-right: 4px; }
.quick-bet {
  padding: 6px 10px; background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 8px; font-size: 1.1rem; transition: .2s; cursor: pointer;
}
.quick-bet:hover { border-color: var(--gold); transform: scale(1.1); }

.section {
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 1.5px solid var(--border); border-radius: 16px;
  padding: 18px; margin-bottom: 16px;
}
.section-header { display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.section-title { font-size: .9rem; font-weight: 900; letter-spacing: .12em;
  text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 8px; }
.section-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; background: var(--bg-2); border: 1.5px solid var(--border);
  border-radius: 10px; font-size: .78rem; font-weight: 800; color: var(--txt-2);
  transition: .2s; text-transform: uppercase; cursor: pointer; user-select: none; }
.btn:hover { border-color: var(--gold); color: var(--gold); }
.btn.danger { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.4); color: var(--err); }
.btn.danger:hover { background: rgba(248,113,113,.25); color: #fff; }

.items-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;
}
@media (max-width: 560px) {
  .items-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
}
.item-card {
  position: relative;
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border: 1.5px solid var(--border); border-radius: 14px;
  padding: 14px 10px 12px; text-align: center;
  transition: .25s; cursor: pointer; overflow: hidden; user-select: none;
}
.item-card.rarity-common { color: var(--common); }
.item-card.rarity-rare { color: var(--rare); }
.item-card.rarity-epic { color: var(--epic); }
.item-card.rarity-legendary { color: var(--legendary); }
.item-card:hover { transform: translateY(-4px); border-color: currentColor;
  box-shadow: 0 12px 30px rgba(0,0,0,.5), 0 0 24px currentColor; }
.item-icon { font-size: 2.8rem; line-height: 1; margin-bottom: 8px;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
.item-name { font-size: .78rem; font-weight: 800; color: var(--txt-1);
  margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-rarity { display: inline-block; padding: 2px 7px; border-radius: 6px;
  font-size: .55rem; font-weight: 900; letter-spacing: .12em;
  text-transform: uppercase; margin-bottom: 6px; }
.item-price { font-size: .74rem; font-weight: 800; color: var(--txt-2);
  font-family: ui-monospace, monospace; }
.item-price .coin { color: var(--gold); }
.item-count {
  position: absolute; top: 8px; right: 8px; background: var(--gold);
  color: #0a0a0a; font-size: .68rem; font-weight: 900;
  padding: 2px 8px; border-radius: 10px; min-width: 24px; z-index: 2;
  font-family: ui-monospace, monospace;
}
.item-sell-btn {
  position: absolute; bottom: 8px; right: 8px; font-size: .6rem; font-weight: 900;
  padding: 4px 9px; border-radius: 6px;
  background: rgba(74,222,128,.15); color: var(--ok);
  letter-spacing: .05em; opacity: 0; transition: .2s; z-index: 2;
  border: 1px solid rgba(74,222,128,.4); cursor: pointer;
}
.item-card:hover .item-sell-btn { opacity: 1; }
.item-sell-btn:hover { background: rgba(74,222,128,.4); color: #fff; }

.history-list { display: flex; flex-direction: column; gap: 8px;
  max-height: 600px; overflow-y: auto; }
.history-item { display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--bg-2);
  border: 1px solid var(--border); border-left: 4px solid var(--border);
  border-radius: 12px; transition: .2s; }
.history-item:hover { background: var(--bg-3); transform: translateX(4px); }
.history-item.win { border-left-color: var(--ok); }
.history-item.lose { border-left-color: var(--err); }
.history-icons { display: flex; align-items: center; gap: 8px;
  font-size: 1.6rem; flex-shrink: 0; }
.history-arrow { color: var(--txt-3); font-size: 1rem; }
.history-info { flex: 1; min-width: 0; }
.history-title { font-size: .85rem; font-weight: 800; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-meta { font-size: .68rem; color: var(--txt-3);
  display: flex; gap: 12px; flex-wrap: wrap; font-family: ui-monospace, monospace; }
.history-result { font-size: .7rem; font-weight: 900; letter-spacing: .08em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 8px; flex-shrink: 0; }
.history-result.win { background: rgba(74,222,128,.15); color: var(--ok); }
.history-result.lose { background: rgba(248,113,113,.15); color: var(--err); }

.top-list { display: flex; flex-direction: column; gap: 6px; }
.top-item { display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: var(--bg-2);
  border: 1px solid var(--border); border-radius: 12px; transition: .2s; }
.top-item:hover { background: var(--bg-3); transform: translateX(4px); }
.top-item .rank { width: 34px; height: 34px; border-radius: 50%;

  border: 2px solid var(--border); flex-shrink: 0; }
.top-item.rank-1 .rank { background: linear-gradient(135deg, #ffd700, #d4af37);
  color: #0a0a0a; border-color: #f6e6a8; }
.top-item .nick { flex: 1; font-weight: 800; font-size: .88rem; }
.top-item .value { font-family: ui-monospace, monospace;

.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;
}
.stat-tile {
  padding: 14px; background: var(--bg-2);
  border: 1px solid var(--border); border-radius: 12px;
  text-align: center; transition: .2s;
}
.stat-tile:hover { border-color: var(--gold); transform: translateY(-2px); }
.stat-tile .value { font-size: 1.5rem; font-weight: 900; color: var(--gold-bright);
  line-height: 1; margin-bottom: 4px; font-family: ui-monospace, monospace; }
.stat-tile .label { font-size: .66rem; color: var(--txt-2);
  letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
.stat-tile.ok .value { color: var(--ok); }
.stat-tile.err .value { color: var(--err); }

.ach-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;
}
.ach-card { display: flex; gap: 10px; padding: 12px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 12px; transition: .2s; }
.ach-card.unlocked { border-color: var(--gold);
  background: linear-gradient(180deg, rgba(212,175,55,.08), var(--bg-2)); }
.ach-card.locked { opacity: .5; }
.ach-icon { font-size: 2rem; flex-shrink: 0; }
.ach-body { flex: 1; }
.ach-name { font-size: .82rem; font-weight: 800; margin-bottom: 2px; }
.ach-desc { font-size: .68rem; color: var(--txt-3); }

.modal {
  position: fixed; inset: 0; z-index: 400; display: none;
  align-items: center; justify-content: center; padding: 16px;
  background: rgba(0,0,0,.85); backdrop-filter: blur(10px);
}
.modal.on { display: flex; animation: fade-in .2s ease; }
.modal-box {
  max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto;
  background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 2px solid var(--gold); border-radius: 20px;
  padding: 24px; position: relative; animation: pop-in .35s ease;
}
.modal-close {
  position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
  border-radius: 50%; background: rgba(248,113,113,.15); color: var(--err);
  font-size: 1.3rem; font-weight: 900; display: flex; align-items: center;
  justify-content: center; transition: .2s; cursor: pointer;
}
.modal-close:hover { background: var(--err); color: #fff; transform: rotate(90deg); }
.modal-title { font-size: 1.15rem; font-weight: 900; letter-spacing: .08em;
  text-transform: uppercase; color: var(--gold-bright);
  margin-bottom: 18px; padding-right: 44px; }

.empty { text-align: center; padding: 50px 20px; color: var(--txt-3);
  font-style: italic; grid-column: 1 / -1; }
.empty-icon { font-size: 3.5rem; display: block; margin-bottom: 14px;
  opacity: .4; font-style: normal; }

#toasts {
  position: fixed; top: 80px; right: 16px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; max-width: 340px;
}
.toast {
  padding: 14px 18px; background: linear-gradient(180deg, var(--card), var(--card-2));
  border: 1.5px solid var(--gold); border-radius: 12px;
  font-size: .85rem; font-weight: 700; color: var(--txt-1);
  transform: translateX(140%); opacity: 0;
  transition: all .35s cubic-bezier(.5, 1.5, .5, 1);
  pointer-events: auto; box-shadow: 0 12px 32px rgba(0,0,0,.6);
}
.toast.show { transform: translateX(0); opacity: 1; }
.toast.success { border-color: var(--ok); color: var(--ok); }
.toast.error { border-color: var(--err); color: var(--err); }
.toast.warn { border-color: var(--warn); color: var(--warn); }
.toast.info { border-color: var(--info); color: #93c5fd; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

@media (max-width: 640px) {
  .topbar { grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px; }
  .topbar-center { display: none; }
  .topbar-logo { font-size: .95rem; }

  .circle-chance { font-size: 2.2rem; }
  .slot-icon { font-size: 2.8rem; }
  .spin-btn { padding: 16px; font-size: .9rem; }
  #toasts { right: 10px; left: 10px; max-width: none; }
}
</style>
</head>

<script>
'use strict';

// ============================================================
// КОНСТАНТЫ
// ============================================================
var API_URL = "https://artamon-api.artem123kv.workers.dev";
var NICK_KEY = "artamon_upgrader_nick_v1";
var SPIN_DURATION = 4500;

// ============================================================
// СОСТОЯНИЕ
// ============================================================
var State = {
  user: null,
  balance: 0,
  inventory: {},
  history: [],
  items: [],
  multiplier: 3,
  betItem: null,
  targetItem: null,
  spinning: false,
  currentTab: "upgrade"
};

// ============================================================
// УТИЛИТЫ
// ============================================================
function $(id) { return document.getElementById(id); }
function $$(sel) { return document.querySelectorAll(sel); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function fmt(n) {
  return Math.floor(n || 0).toLocaleString("ru-RU");
}

function timeAgo(ts) {
  if (!ts) return "—";
  var diff = Date.now() - ts;
  var min = Math.floor(diff / 60000);
  if (min < 1) return "только что";
  if (min < 60) return min + " мин назад";
  var hrs = Math.floor(min / 60);
  if (hrs < 24) return hrs + " ч назад";
  var days = Math.floor(hrs / 24);
  if (days < 30) return days + " дн назад";
  return new Date(ts).toLocaleDateString("ru-RU");
}

function toast(msg, type) {
  type = type || "info";
  var el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  var box = $("toasts");
  if (!box) return;
  box.appendChild(el);
  setTimeout(function() { el.classList.add("show"); }, 30);
  setTimeout(function() {
    el.classList.remove("show");
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
  }, 3500);
}

function getNick() {
  try {
    var params = new URLSearchParams(window.location.search);
    var nick = params.get("nick");
    if (nick) {
      localStorage.setItem(NICK_KEY, nick);
      return nick;
    }
    return localStorage.getItem(NICK_KEY) || "";
  } catch (e) {
    return "";
  }
}

// ============================================================
// API
// ============================================================
function apiCall(path, body) {
  return fetch(API_URL + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function(r) {
    return r.text().then(function(text) {
      try { return JSON.parse(text); }
      catch (e) { return { ok: false, error: "Bad JSON" }; }
    });
  }).catch(function(e) {
    return { ok: false, error: "Сеть: " + e.message };
  });
}

function apiGet(path) {
  return fetch(API_URL + path, { cache: "no-store" })
    .then(function(r) { return r.json(); })
    .catch(function(e) { return { ok: false, error: "Сеть: " + e.message }; });
}

// ============================================================
// UI — ВСЕ РЕНДЕРЫ
// ============================================================
var UI = {

  // ---------- Инициализация UI ----------
  renderAll: function() {
    UI.renderBalance();
    UI.renderAvatar();
    UI.renderInvBadge();
    UI.renderBetSlot();
    UI.renderTargetSlot();
    UI.renderMultipliers();
    UI.renderCircle();
    UI.renderQuickBets();
    UI.renderInventory();
    UI.renderShop();
    UI.renderHistory();
    UI.renderTop();
    UI.renderAchievements();
    UI.renderProfile();
  },

  // ---------- Баланс ----------
  renderBalance: function() {
    var el = $("balanceDisplay");
    if (el) el.textContent = fmt(State.balance);
    var box = $("balanceBox");
    if (box) {
      box.classList.add("updating");
      setTimeout(function() { box.classList.remove("updating"); }, 500);
    }
  },

  // ---------- Аватар ----------
  renderAvatar: function() {
    var av = $("userAvatar");
    if (!av) return;
    if (State.user) {
      av.textContent = State.user.nick.charAt(0).toUpperCase();
      av.title = State.user.nick;
    } else {
      av.textContent = "?";
    }
  },

  // ---------- Бейдж инвентаря ----------
  renderInvBadge: function() {
    var total = 0;
    for (var k in State.inventory) {
      if (State.inventory.hasOwnProperty(k)) total += State.inventory[k];
    }
    var badge = $("invBadge");
    if (badge) badge.textContent = total;
  },

  // ---------- Слоты ----------
  renderBetSlot: function() {
    var slot = $("betSlot");
    if (!slot) return;
    if (State.betItem) {
      var it = State.betItem;
      slot.className = "slot filled rarity-" + it.rarity;
      slot.innerHTML =
        '<button class="slot-remove" type="button" onclick="event.stopPropagation();UI.removeBet()">×</button>' +
        '<span class="slot-icon">' + it.icon + '</span>' +
        '<span class="slot-name">' + esc(it.name) + '</span>' +
        '<span class="slot-rarity-tag r-' + it.rarity + '">' + it.rarity.toUpperCase() + '</span>' +
        '<span class="slot-price"><span class="coin">🪙</span> ' + fmt(it.price) + '</span>';
    } else {
      slot.className = "slot";
      slot.innerHTML = '<span class="slot-hint">Нажми</span><span class="slot-empty-icon">➕</span><span class="slot-hint">Твой предмет</span>';
    }
  },

  renderTargetSlot: function() {
    var slot = $("targetSlot");
    if (!slot) return;
    if (State.targetItem) {
      var it = State.targetItem;
      slot.className = "slot filled rarity-" + it.rarity;
      slot.innerHTML =
        '<button class="slot-remove" type="button" onclick="event.stopPropagation();UI.removeTarget()">×</button>' +
        '<span class="slot-icon">' + it.icon + '</span>' +
        '<span class="slot-name">' + esc(it.name) + '</span>' +
        '<span class="slot-rarity-tag r-' + it.rarity + '">' + it.rarity.toUpperCase() + '</span>' +
        '<span class="slot-price"><span class="coin">🪙</span> ' + fmt(it.price) + '</span>';
    } else {
      slot.className = "slot";
      slot.innerHTML = '<span class="slot-hint">Нажми</span><span class="slot-empty-icon">🎯</span><span class="slot-hint">Цель</span>';
    }
  },

  // ---------- Круг ----------
  renderCircle: function() {
    var circle = $("circleWin");
    var chanceEl = $("chanceValue");
    var payoutEl = $("payoutValue");

    if (!circle) return;

    var chance = 0;
    if (State.betItem && State.targetItem) {
      chance = Math.min((100 / State.multiplier) * 0.95, 95);
    }

    var r = 104;
    var circ = 2 * Math.PI * r;
    var winLength = circ * (chance / 100);

    circle.style.strokeDasharray = winLength + " " + circ;

    if (chanceEl) {
      chanceEl.textContent = chance.toFixed(2) + "%";
      var cls = "circle-chance";
      if (chance > 0) {
        if (chance < 20) cls += " low";
        else if (chance < 50) cls += " mid";
        else cls += " high";
      }
      chanceEl.className = cls;
    }

    if (payoutEl) {
      var payout = State.betItem ? Math.floor(State.betItem.price * State.multiplier) : 0;
      payoutEl.textContent = payout > 0 ? "+" + fmt(payout) + " 🪙" : "—";
    }

    this.renderSpinBtn();
  },

  renderSpinBtn: function() {
    var btn = $("spinBtn");
    if (!btn) return;
    if (State.spinning) {
      btn.disabled = true;
      btn.innerHTML = '<span class="icon">⏳</span><span class="text">КРУТИТСЯ...</span>';
      return;
    }
    var canSpin = State.betItem && State.targetItem && State.user;
    btn.disabled = !canSpin;
    btn.innerHTML = '<span class="icon">🎰</span><span class="text">КРУТИТЬ</span>';
  },

  // ---------- Множители ----------
  renderMultipliers: function() {
    var btns = $$(".mult-btn");
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      var m = parseFloat(b.dataset.mult);
      b.classList.toggle("active", Math.abs(m - State.multiplier) < 0.01);
    }
    var slider = $("multSlider");
    if (slider) slider.value = Math.min(100, Math.max(1.1, State.multiplier));
    this.renderSliderValue();
  },

  renderSliderValue: function() {
    var slider = $("multSlider");
    var val = $("sliderValue");
    if (!slider || !val) return;
    var v = parseFloat(slider.value);
    var pct = (v - 1.1) / (100 - 1.1) * 100;
    val.style.left = pct + "%";
    val.textContent = "x" + v.toFixed(2);
  },

  // ---------- Быстрые ставки ----------
  renderQuickBets: function() {
    var box = $("quickBets");
    var list = $("quickBetsList");
    if (!box || !list) return;

    var entries = [];
    for (var id in State.inventory) {
      if (State.inventory.hasOwnProperty(id) && State.inventory[id] > 0) {
        entries.push([id, State.inventory[id]]);
      }
    }

    if (!entries.length) {
      box.style.display = "none";
      return;
    }

    entries.sort(function(a, b) {
      var ia = State.findItem(a[0]);
      var ib = State.findItem(b[0]);
      return (ib ? ib.price : 0) - (ia ? ia.price : 0);
    });

    list.innerHTML = "";
    entries.slice(0, 3).forEach(function(e) {
      var it = State.findItem(e[0]);
      if (!it) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quick-bet";
      btn.textContent = it.icon;
      btn.title = it.name + " (" + fmt(it.price) + " 🪙)";
      btn.onclick = function() { UI.quickBet(it.id); };
      list.appendChild(btn);
    });

    box.style.display = "flex";
  },

  // ---------- Инвентарь ----------
  renderInventory: function() {
    var grid = $("inventoryGrid");
    if (!grid) return;

    var entries = [];
    for (var id in State.inventory) {
      if (State.inventory.hasOwnProperty(id) && State.inventory[id] > 0) {
        entries.push([id, State.inventory[id]]);
      }
    }

    var total = entries.reduce(function(a, e) { return a + e[1]; }, 0);
    var countEl = $("invCount");
    if (countEl) countEl.textContent = "Всего: " + total + " шт.";

    if (!entries.length) {
      grid.innerHTML = '<div class="empty"><span class="empty-icon">🎒</span>Инвентарь пуст</div>';
      var sellBtn = $("sellCommonsBtn");
      if (sellBtn) sellBtn.style.display = "none";
      return;
    }

    var hasCommons = entries.some(function(e) {
      var it = State.findItem(e[0]);
      return it && it.rarity === "common";
    });
    var sellBtn2 = $("sellCommonsBtn");
    if (sellBtn2) sellBtn2.style.display = hasCommons ? "inline-flex" : "none";

    // Сортировка: legendary → epic → rare → common
    var order = { legendary: 0, epic: 1, rare: 2, common: 3 };
    entries.sort(function(a, b) {
      var ia = State.findItem(a[0]);
      var ib = State.findItem(b[0]);
      if (!ia || !ib) return 0;
      var oa = order[ia.rarity] != null ? order[ia.rarity] : 4;
      var ob = order[ib.rarity] != null ? order[ib.rarity] : 4;
      return oa - ob;
    });

    grid.innerHTML = "";
    entries.forEach(function(e) {
      var it = State.findItem(e[0]);
      if (!it) return;
      var sellPrice = Math.floor(it.price * 0.7);
      var card = document.createElement("div");
      card.className = "item-card rarity-" + it.rarity;
      card.innerHTML =
        '<div class="item-count">' + e[1] + '</div>' +
        '<div class="item-icon">' + it.icon + '</div>' +
        '<div class="item-name">' + esc(it.name) + '</div>' +
        '<div class="item-rarity r-' + it.rarity + '">' + it.rarity.toUpperCase() + '</div>' +
        '<div class="item-price"><span class="coin">🪙</span> ' + fmt(it.price) + '</div>' +
        '<button class="item-sell-btn" type="button">+ ' + fmt(sellPrice) + ' 🪙</button>';

      var sellButton = card.querySelector(".item-sell-btn");
      sellButton.onclick = function(ev) {
        ev.stopPropagation();
        UI.sellItem(it.id);
      };

      grid.appendChild(card);
    });
  },

  // ---------- Магазин ----------
  renderShop: function() {
    var grid = $("shopGrid");
    if (!grid) return;

    var filter = "all";
    var filterEl = $("shopFilter");
    if (filterEl) filter = filterEl.value;

    var list = State.items.slice();
    if (filter !== "all") {
      list = list.filter(function(i) { return i.rarity === filter; });
    }

    if (!list.length) {
      grid.innerHTML = '<div class="empty"><span class="empty-icon">🔍</span>Ничего не найдено</div>';
      return;
    }

    grid.innerHTML = "";
    list.forEach(function(it) {
      var canBuy = State.balance >= it.price;
      var card = document.createElement("div");
      card.className = "item-card rarity-" + it.rarity;
      if (!canBuy) card.style.opacity = "0.5";
      card.innerHTML =
        '<div class="item-icon">' + it.icon + '</div>' +
        '<div class="item-name">' + esc(it.name) + '</div>' +
        '<div class="item-rarity r-' + it.rarity + '">' + it.rarity.toUpperCase() + '</div>' +
        '<div class="item-price"><span class="coin">🪙</span> ' + fmt(it.price) + '</div>';
      card.onclick = function() { UI.buyItem(it.id); };
      grid.appendChild(card);
    });
  },

  // ---------- История ----------
  renderHistory: function() {
    var box = $("historyList");
    if (!box) return;

    var list = State.history.slice(0, 100);
    if (!list.length) {
      box.innerHTML = '<div class="empty"><span class="empty-icon">📜</span>История пуста</div>';
      return;
    }

    box.innerHTML = "";
    list.forEach(function(h) {
      var from = State.findItem(h.betItemId || h.from);
      var to = State.findItem(h.targetItemId || h.to);
      if (!from || !to) return;

      var el = document.createElement("div");
      el.className = "history-item " + (h.win ? "win" : "lose");
      el.innerHTML =
        '<div class="history-icons">' +
          '<span>' + from.icon + '</span>' +
          '<span class="history-arrow">→</span>' +
          '<span>' + to.icon + '</span>' +
        '</div>' +
        '<div class="history-info">' +
          '<div class="history-title">' + esc(from.name) + ' → ' + esc(to.name) + '</div>' +
          '<div class="history-meta">' +
            '<span>x' + (h.multiplier || h.mult || 0).toFixed(2) + '</span>' +
            '<span>' + timeAgo(h.ts) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="history-result ' + (h.win ? "win" : "lose") + '">' +
          (h.win ? "WIN" : "LOSE") +
        '</div>';
      box.appendChild(el);
    });
  },

  // ---------- Топ ----------
  renderTop: function() {
    var box = $("topList");
    if (!box) return;

    var wins = 0, profit = 0;
    State.history.forEach(function(h) {
      var from = State.findItem(h.betItemId || h.from);
      var to = State.findItem(h.targetItemId || h.to);
      if (h.win) { wins++; if (to) profit += to.price; }
      else { if (from) profit -= from.price; }
    });

    box.innerHTML =
      '<div class="top-item rank-1">' +
        '<div class="rank">🥇</div>' +
        '<div class="nick">' + esc(State.user ? State.user.nick : "?") + ' <span style="color:var(--txt-3);font-size:.7rem;">(ты)</span></div>' +
        '<div class="value">' + (profit >= 0 ? "+" : "") + fmt(profit) + ' 🪙</div>' +
      '</div>' +
      '<div class="top-item"><div class="rank">2</div><div class="nick" style="color:var(--txt-3);">Общий топ появится позже</div><div class="value">—</div></div>' +
      '<div class="top-item"><div class="rank">3</div><div class="nick" style="color:var(--txt-3);">Общий топ появится позже</div><div class="value">—</div></div>';
  },

  // ---------- Достижения ----------
  renderAchievements: function() {
    var grid = $("achGrid");
    if (!grid) return;

    var total = State.history.length;
    var wins = State.history.filter(function(h) { return h.win; }).length;

    var list = [
      { id: "first_upgrade", icon: "🎯", name: "Первый апгрейд", desc: "Сделай первый апгрейд", done: total >= 1 },
      { id: "first_win", icon: "🎉", name: "Первая победа", desc: "Выиграй апгрейд", done: wins >= 1 },
      { id: "win_10", icon: "🔥", name: "10 побед", desc: "Выиграй 10 апгрейдов", done: wins >= 10 },
      { id: "win_50", icon: "⚡", name: "50 побед", desc: "Выиграй 50 апгрейдов", done: wins >= 50 },
      { id: "rare_drop", icon: "🔵", name: "Rare дроп", desc: "Получи Rare предмет", done: false },
      { id: "epic_drop", icon: "🟣", name: "Epic дроп", desc: "Получи Epic предмет", done: false },
      { id: "legendary_drop", icon: "🟡", name: "Legendary дроп", desc: "Получи Legendary предмет", done: false },
      { id: "gambler", icon: "🎲", name: "Азартный", desc: "Сделай 100 апгрейдов", done: total >= 100 }
    ];

    // Проверяем Rare/Epic/Legendary по истории
    State.history.forEach(function(h) {
      if (!h.win) return;
      var to = State.findItem(h.targetItemId || h.to);
      if (!to) return;
      if (to.rarity === "rare") list[4].done = true;
      if (to.rarity === "epic") list[5].done = true;
      if (to.rarity === "legendary") list[6].done = true;
    });

    grid.innerHTML = "";
    list.forEach(function(a) {
      var card = document.createElement("div");
      card.className = "ach-card " + (a.done ? "unlocked" : "locked");
      card.innerHTML =
        '<div class="ach-icon">' + (a.done ? a.icon : "🔒") + '</div>' +
        '<div class="ach-body">' +
          '<div class="ach-name">' + esc(a.name) + '</div>' +
          '<div class="ach-desc">' + esc(a.desc) + '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  },

  // ---------- Профиль ----------
  renderProfile: function() {
    var box = $("profileContent");
    if (!box) return;

    var total = State.history.length;
    var wins = State.history.filter(function(h) { return h.win; }).length;
    var loses = total - wins;
    var winrate = total ? Math.round(wins / total * 100) : 0;

    var profit = 0;
    State.history.forEach(function(h) {
      var from = State.findItem(h.betItemId || h.from);
      var to = State.findItem(h.targetItemId || h.to);
      if (h.win) { if (to) profit += to.price; }
      else { if (from) profit -= from.price; }
    });

    var totalItems = 0;
    for (var k in State.inventory) {
      if (State.inventory.hasOwnProperty(k)) totalItems += State.inventory[k];
    }

    box.innerHTML =
      '<div class="stats-grid">' +
        '<div class="stat-tile"><div class="value">' + total + '</div><div class="label">Всего игр</div></div>' +
        '<div class="stat-tile ok"><div class="value">' + wins + '</div><div class="label">Побед</div></div>' +
        '<div class="stat-tile err"><div class="value">' + loses + '</div><div class="label">Проигрышей</div></div>' +
        '<div class="stat-tile"><div class="value">' + winrate + '%</div><div class="label">Winrate</div></div>' +
        '<div class="stat-tile ' + (profit >= 0 ? "ok" : "err") + '"><div class="value">' + (profit >= 0 ? "+" : "") + fmt(profit) + '</div><div class="label">Профит</div></div>' +
        '<div class="stat-tile"><div class="value">' + totalItems + '</div><div class="label">Предметов</div></div>' +
      '</div>';

    var nickEl = $("profileNick");
    if (nickEl) nickEl.textContent = State.user ? State.user.nick : "—";
  },

  // ---------- Переключение вкладок ----------
  switchTab: function(tab) {
    State.currentTab = tab;

    var navBtns = $$(".nav-btn");
    for (var i = 0; i < navBtns.length; i++) {
      navBtns[i].classList.toggle("active", navBtns[i].dataset.tab === tab);
    }

    var contents = $$(".tab-content");
    for (var j = 0; j < contents.length; j++) {
      contents[j].classList.toggle("active", contents[j].dataset.tab === tab);
    }

    // Рендер соответствующей вкладки
    if (tab === "inventory") UI.renderInventory();
    else if (tab === "shop") UI.renderShop();
    else if (tab === "history") UI.renderHistory();
    else if (tab === "top") UI.renderTop();
    else if (tab === "achievements") UI.renderAchievements();
    else if (tab === "profile") UI.renderProfile();
  },

  // ---------- Модалка ----------
  openModal: function(title, html) {
    var mt = $("modalTitle");
    var mb = $("modalBody");
    if (mt) mt.textContent = title;
    if (mb) mb.innerHTML = html;
    var modal = $("modal");
    if (modal) modal.classList.add("on");
  },

  closeModal: function() {
    var modal = $("modal");
    if (modal) modal.classList.remove("on");
  },

  // ---------- Слоты: действия ----------
  removeBet: function() {
    if (State.spinning) return;
    State.betItem = null;
    UI.renderBetSlot();
    UI.renderCircle();
  },

  removeTarget: function() {
    if (State.spinning) return;
    State.targetItem = null;
    UI.renderTargetSlot();
    UI.renderCircle();
  },

  quickBet: function(id) {
    if (State.spinning) return;
    var it = State.findItem(id);
    if (!it) return;
    State.betItem = it;
    if (!State.targetItem) UI.autoPickTarget(it);
    UI.renderBetSlot();
    UI.renderTargetSlot();
    UI.renderCircle();
  },

  autoPickTarget: function(betItem) {
    for (var i = 0; i < State.items.length; i++) {
      if (State.items[i].price > betItem.price) {
        State.targetItem = State.items[i];
        State.multiplier = Math.min(100, Math.max(1.1, State.items[i].price / betItem.price));
        UI.renderMultipliers();
        return;
      }
    }
  },

  // ---------- Выбор предмета ----------
  openBetPicker: function() {
    if (State.spinning || State.betItem) return;

    var html = '<div class="items-grid">';
    var hasItems = false;

    for (var id in State.inventory) {
      if (!State.inventory.hasOwnProperty(id)) continue;
      if (State.inventory[id] <= 0) continue;
      var it = State.findItem(id);
      if (!it) continue;
      hasItems = true;
      html +=
        '<div class="item-card rarity-' + it.rarity + '" data-id="' + id + '">' +
          '<div class="item-count">' + State.inventory[id] + '</div>' +
          '<div class="item-icon">' + it.icon + '</div>' +
          '<div class="item-name">' + esc(it.name) + '</div>' +
          '<div class="item-rarity r-' + it.rarity + '">' + it.rarity.toUpperCase() + '</div>' +
          '<div class="item-price"><span class="coin">🪙</span> ' + fmt(it.price) + '</div>' +
        '</div>';
    }

    if (!hasItems) {
      html += '<div class="empty" style="grid-column:1/-1;"><span class="empty-icon">🎒</span>Инвентарь пуст</div>';
    }
    html += '</div>';

    UI.openModal("🎒 Выбери предмет для ставки", html);

    var cards = document.querySelectorAll('#modalBody .item-card[data-id]');
    for (var i = 0; i < cards.length; i++) {
      (function(card) {
        card.onclick = function() {
          var itemId = card.getAttribute("data-id");
          var item = State.findItem(itemId);
          if (!item) return;
          if ((State.inventory[item.id] || 0) <= 0) {
            toast("❌ У тебя нет " + item.name, "error");
            return;
          }
          State.betItem = item;
          if (!State.targetItem) UI.autoPickTarget(item);
          UI.renderBetSlot();
          UI.renderTargetSlot();
          UI.renderCircle();
          UI.closeModal();
        };
      })(cards[i]);
    }
  },

  openTargetPicker: function() {
    if (State.spinning) return;

    var html = '<div class="items-grid">';
    for (var i = 0; i < State.items.length; i++) {
      var it = State.items[i];
      var disabled = State.betItem && it.price <= State.betItem.price;
      html +=
        '<div class="item-card rarity-' + it.rarity + '" data-id="' + it.id + '" ' +
        (disabled ? 'style="opacity:.35;pointer-events:none;"' : '') + '>' +
          '<div class="item-icon">' + it.icon + '</div>' +
          '<div class="item-name">' + esc(it.name) + '</div>' +
          '<div class="item-rarity r-' + it.rarity + '">' + it.rarity.toUpperCase() + '</div>' +
          '<div class="item-price"><span class="coin">🪙</span> ' + fmt(it.price) + '</div>' +
        '</div>';
    }
    html += '</div>';

    UI.openModal("🎯 Выбери цель апгрейда", html);

    var cards = document.querySelectorAll('#modalBody .item-card[data-id]');
    for (var j = 0; j < cards.length; j++) {
      (function(card) {
        card.onclick = function() {
          var itemId = card.getAttribute("data-id");
          var item = State.findItem(itemId);
          if (!item) return;
          if (State.betItem && item.price <= State.betItem.price) {
            toast("⚠️ Цель должна быть дороже ставки", "warn");
            return;
          }
          State.targetItem = item;
          if (State.betItem) {
            State.multiplier = Math.min(100, Math.max(1.1, item.price / State.betItem.price));
            UI.renderMultipliers();
          }
          UI.renderTargetSlot();
          UI.renderCircle();
          UI.closeModal();
        };
      })(cards[j]);
    }
  },

  // ---------- Продажа / покупка ----------
  sellItem: function(id) {
    var it = State.findItem(id);
    if (!it || (State.inventory[id] || 0) <= 0) return;

    var price = Math.floor(it.price * 0.7);
    if (!confirm("Продать " + it.icon + " " + it.name + " за " + fmt(price) + " 🪙?")) return;

    apiCall("/api/upgrade-sell", { nick: State.user.nick, itemId: id }).then(function(d) {
      if (!d.ok) { toast("❌ " + (d.error || "Ошибка"), "error"); return; }
      State.balance = d.coins != null ? d.coins : State.balance;
      State.inventory = d.inventory || {};
      UI.renderBalance();
      UI.renderInvBadge();
      UI.renderInventory();
      UI.renderQuickBets();
      toast("💰 Продано за " + fmt(d.sold || price) + " 🪙", "success");
    });
  },

  sellAllCommons: function() {
    var entries = [];
    for (var id in State.inventory) {
      if (!State.inventory.hasOwnProperty(id)) continue;
      if (State.inventory[id] <= 0) continue;
      var it = State.findItem(id);
      if (it && it.rarity === "common") entries.push([id, State.inventory[id]]);
    }
    if (!entries.length) return;

    var totalPrice = 0, totalCount = 0;
    entries.forEach(function(e) {
      var it = State.findItem(e[0]);
      totalPrice += Math.floor(it.price * 0.7) * e[1];
      totalCount += e[1];
    });

    if (!confirm("Продать все Common предметы?\n\n" + totalCount + " шт. за " + fmt(totalPrice) + " 🪙")) return;

    var promise = Promise.resolve();
    entries.forEach(function(e) {
      for (var i = 0; i < e[1]; i++) {
        promise = promise.then(function(id) {
          return apiCall("/api/upgrade-sell", { nick: State.user.nick, itemId: id }).then(function(d) {
            if (d.ok) {
              State.balance = d.coins != null ? d.coins : State.balance;
              State.inventory = d.inventory || {};
            }
          });
        }.bind(null, e[0]));
      }
    });

    promise.then(function() {
      UI.renderBalance();
      UI.renderInvBadge();
      UI.renderInventory();
      UI.renderQuickBets();
      toast("💰 Продано " + totalCount + " шт. за " + fmt(totalPrice) + " 🪙", "success");
    });
  },

  buyItem: function(id) {
    var it = State.findItem(id);
    if (!it) return;
    if (State.balance < it.price) { toast("❌ Недостаточно монет", "error"); return; }
    if (!confirm("Купить " + it.icon + " " + it.name + " за " + fmt(it.price) + " 🪙?")) return;

    apiCall("/api/upgrade-buy", { nick: State.user.nick, itemId: id }).then(function(d) {
      if (!d.ok) { toast("❌ " + (d.error || "Ошибка"), "error"); return; }
      State.balance = d.coins != null ? d.coins : State.balance;
      State.inventory = d.inventory || {};
      UI.renderBalance();
      UI.renderInvBadge();
      UI.renderShop();
      UI.renderQuickBets();
      toast("✅ Куплен " + it.icon + " " + it.name, "success");
    });
  },

  // ---------- Результат ----------
  showResult: function(type, from, to) {
    var card = $("resultCard");
    var emoji = $("resultEmoji");
    var title = $("resultTitle");
    var sub = $("resultSub");
    var reward = $("resultReward");

    card.className = "result-card " + type;
    emoji.className = "result-emoji " + type;
    title.className = "result-title " + type;

    if (type === "win" || type === "jackpot") {
      emoji.textContent = type === "jackpot" ? "💎" : "🎉";
      title.textContent = type === "jackpot" ? "ДЖЕКПОТ!" : "ПОБЕДА!";
      sub.textContent = "Ты апгрейднул " + from.name + " до " + to.name + "!";
      reward.innerHTML = '<span class="icon">' + from.icon + '</span> → <span class="icon">' + to.icon + '</span> · <span class="green">+' + fmt(to.price) + ' 🪙</span>';
      UI.spawnConfetti();
    } else {
      emoji.textContent = "💀";
      title.textContent = "ПРОИГРЫШ";
      sub.textContent = "Предмет " + from.name + " сгорел";
      reward.innerHTML = '<span class="icon">' + from.icon + '</span> → <span class="red">−' + fmt(from.price) + ' 🪙</span>';
    }

    var overlay = $("resultOverlay");
    if (overlay) overlay.classList.add("on");
  },

  closeResult: function() {
    var overlay = $("resultOverlay");
    if (overlay) overlay.classList.remove("on");
  },

  spawnConfetti: function() {
    var box = $("confetti");
    if (!box) return;
    box.innerHTML = "";
    var colors = ["#d4af37", "#4ade80", "#f6e6a8", "#f59e0b", "#60a5fa", "#a855f7"];
    for (var i = 0; i < 50; i++) {
      var p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.left = Math.random() * 100 + "%";
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDelay = Math.random() * 0.5 + "s";
      p.style.animationDuration = (2.5 + Math.random() * 2) + "s";
      box.appendChild(p);
    }
  }
};

// Добавляем findItem в State
State.findItem = function(id) {
  for (var i = 0; i < this.items.length; i++) {
    if (this.items[i].id === id) return this.items[i];
  }
  return null;
};

// ============================================================
// ЛОГИКА АПГРЕЙДА
// ============================================================
function doUpgrade() {
  if (State.spinning) return;
  if (!State.betItem || !State.targetItem) {
    toast("⚠️ Выбери предмет и цель", "warn");
    return;
  }
  if (!State.user || !State.user.nick) {
    toast("❌ Не авторизован", "error");
    return;
  }
  if ((State.inventory[State.betItem.id] || 0) <= 0) {
    toast("❌ У тебя нет " + State.betItem.name, "error");
    return;
  }

  State.spinning = true;
  UI.renderSpinBtn();

  var betItem = State.betItem;
  var targetItem = State.targetItem;
  var multiplier = State.multiplier;
  var chance = Math.min((100 / multiplier) * 0.95, 95);

  // Отправляем запрос
  var spinPromise = apiCall("/api/upgrade-spin", {
    nick: State.user.nick,
    betItemId: betItem.id,
    targetItemId: targetItem.id,
    multiplier: multiplier
  });

  // Анимация
  var pointer = $("circlePointer");
  pointer.classList.remove("win", "lose", "spinning");
  pointer.style.transform = "rotate(0deg)";

  var randomSpin = 360 * 4 + Math.random() * 360;
  setTimeout(function() {
    pointer.classList.add("spinning");
    pointer.style.transform = "rotate(" + randomSpin + "deg)";
  }, 50);

  // Ждём результат
  spinPromise.then(function(result) {
    setTimeout(function() {
      State.spinning = false;
      pointer.classList.remove("spinning");

      if (!result || !result.ok) {
        toast("❌ " + (result && result.error || "Ошибка сервера"), "error");
        UI.renderSpinBtn();
        return;
      }

      var isWin = result.win;
      var isJackpot = isWin && multiplier >= 25;

      // Обновляем состояние
      if (result.inventory) State.inventory = result.inventory;
      if (typeof result.coins === "number") State.balance = result.coins;

      // Точное позиционирование
      var winZoneAngle = (chance / 100) * 360;
      var targetAngle = isWin
        ? Math.random() * winZoneAngle
        : winZoneAngle + Math.random() * (360 - winZoneAngle);
      var finalAngle = 360 - targetAngle;

      pointer.classList.add(isWin ? "win" : "lose");
pointer.style.transform = "rotate(" + (360 * 4 + finalAngle) + "deg)";

      // Записываем в историю
      State.history.unshift({
        id: Date.now().toString(36),
        ts: Date.now(),
        betItemId: betItem.id,
        targetItemId: targetItem.id,
        multiplier: multiplier,
        win: isWin
      });
      if (State.history.length > 500) State.history.length = 500;

      // Показываем результат
      setTimeout(function() {
        UI.showResult(isJackpot ? "jackpot" : (isWin ? "win" : "lose"), betItem, targetItem);

        if (isWin) {
          toast("🎉 ПОБЕДА! Получен " + targetItem.icon + " " + targetItem.name, "success");
        } else {
          toast("💀 Проигрыш. Потерян " + betItem.icon + " " + betItem.name, "error");
        }

        UI.renderBalance();
        UI.renderInvBadge();
        UI.renderInventory();
        UI.renderQuickBets();

        // Сброс ставки
        State.betItem = null;
        State.targetItem = null;
        UI.renderBetSlot();
        UI.renderTargetSlot();
        UI.renderCircle();

        if (State.currentTab === "history") UI.renderHistory();
        if (State.currentTab === "profile") UI.renderProfile();
      }, 300);
    }, SPIN_DURATION);
  });
}

// ============================================================
// ЗАГРУЗКА ДАННЫХ
// ============================================================
function loadItems() {
  return apiGet("/api/upgrade-items").then(function(d) {
    if (d.ok && Array.isArray(d.items)) {
      State.items = d.items;
    } else {
      State.items = getDefaultItems();
    }
    return true;
  });
}

function getDefaultItems() {
  return [
    { id: "coin_1", icon: "🪙", name: "Монетка", price: 100, rarity: "common" },
    { id: "coin_2", icon: "💰", name: "Мешочек монет", price: 500, rarity: "common" },
    { id: "gem_1", icon: "💎", name: "Кристалл", price: 1000, rarity: "rare" },
    { id: "gem_2", icon: "🔮", name: "Магический шар", price: 2500, rarity: "rare" },
    { id: "sword_1", icon: "⚔️", name: "Стальной меч", price: 5000, rarity: "epic" },
    { id: "shield_1", icon: "🛡️", name: "Золотой щит", price: 10000, rarity: "epic" },
    { id: "crown_1", icon: "👑", name: "Корона", price: 25000, rarity: "legendary" },
    { id: "dragon_1", icon: "🐉", name: "Дракон", price: 50000, rarity: "legendary" },
    { id: "trophy_1", icon: "🏆", name: "Кубок", price: 100000, rarity: "legendary" }
  ];
}

function loadProfile() {
  var nick = getNick();
  if (!nick) return Promise.resolve(false);

  State.user = { nick: nick };

  return apiCall("/api/upgrade-history", { nick: nick }).then(function(d) {
    if (!d.ok) {
      toast("⚠️ Не удалось загрузить профиль", "error");
      return false;
    }

    State.balance = d.coins || 0;
    State.inventory = d.inventory || {};
    State.history = Array.isArray(d.history) ? d.history : [];

    return true;
  });
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
function init() {
  // Рисуем тики на круге
  var g = $("ticks");
  if (g) {
    for (var i = 0; i < 60; i++) {
      var angle = (i * 360 / 60) * Math.PI / 180;
      var isMajor = i % 5 === 0;
      var r1 = isMajor ? 92 : 96;
      var r2 = 100;
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", 120 + Math.cos(angle) * r1);
      line.setAttribute("y1", 120 + Math.sin(angle) * r1);
      line.setAttribute("x2", 120 + Math.cos(angle) * r2);
      line.setAttribute("y2", 120 + Math.sin(angle) * r2);
      line.setAttribute("class", "circle-tick" + (isMajor ? " major" : ""));
      g.appendChild(line);
    }
  }

  // ===== ОБРАБОТЧИКИ КНОПОК =====

  // Навигация
  var navBtns = document.querySelectorAll(".nav-btn");
  for (var i = 0; i < navBtns.length; i++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        var tab = btn.getAttribute("data-tab");
        if (tab) UI.switchTab(tab);
      });
    })(navBtns[i]);
  }

  // Множители
  var multBtns = document.querySelectorAll(".mult-btn");
  for (var j = 0; j < multBtns.length; j++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        if (State.spinning) return;
        State.multiplier = parseFloat(btn.getAttribute("data-mult"));
        UI.renderMultipliers();
        UI.renderCircle();
      });
    })(multBtns[j]);
  }

  // Слайдер
  var slider = $("multSlider");
  if (slider) {
    slider.addEventListener("input", function() {
      if (State.spinning) return;
      State.multiplier = parseFloat(slider.value);
      var btns = document.querySelectorAll(".mult-btn");
      for (var k = 0; k < btns.length; k++) btns[k].classList.remove("active");
      UI.renderSliderValue();
      UI.renderCircle();
    });
  }

  // Кнопка крутить
  var spinBtn = $("spinBtn");
  if (spinBtn) spinBtn.addEventListener("click", doUpgrade);

  // Фильтр магазина
  var shopFilter = $("shopFilter");
  if (shopFilter) shopFilter.addEventListener("change", UI.renderShop);

  // Модалка: закрытие по фону
  var modal = $("modal");
  if (modal) {
    modal.addEventListener("click", function(e) {
      if (e.target === modal) UI.closeModal();
    });
  }

  // Результат: закрытие по фону
  var resultOverlay = $("resultOverlay");
  if (resultOverlay) {
    resultOverlay.addEventListener("click", function(e) {
      if (e.target === resultOverlay) UI.closeResult();
    });
  }

  // Аватар — переход на профиль
  var avatar = $("userAvatar");
  if (avatar) {
    avatar.addEventListener("click", function() { UI.switchTab("profile"); });
  }

  // Баланс — инфо
  var balanceBox = $("balanceBox");
  if (balanceBox) {
    balanceBox.addEventListener("click", function() {
      UI.openModal("🪙 Монеты",
        '<div style="text-align:center;padding:20px 0;">' +
          '<div style="font-size:2.5rem;margin-bottom:12px;">🪙</div>' +
          '<div style="font-size:2rem;font-weight:900;color:var(--gold-bright);font-family:ui-monospace,monospace;margin-bottom:8px;">' + fmt(State.balance) + '</div>' +
          '<div style="font-size:.85rem;color:var(--txt-2);line-height:1.6;">' +
            'Монеты можно получить:<br>• Продавая предметы<br>• Выигрывая апгрейды' +
          '</div>' +
        '</div>'
      );
    });
  }

  // ===== ЗАГРУЗКА ДАННЫХ =====
  loadItems().then(function() {
    return loadProfile();
  }).then(function(ok) {
    if (!ok) {
      // Показываем экран "войди через игру"
      var app = $("app");
      if (app) {
        app.innerHTML =
          '<div style="text-align:center;padding:80px 20px;max-width:500px;margin:0 auto;">' +
            '<div style="font-size:4rem;margin-bottom:20px;">🔐</div>' +
            '<div style="font-size:1.4rem;font-weight:900;color:var(--gold-bright);margin-bottom:12px;">Войди через игру</div>' +
            '<div style="font-size:.9rem;color:var(--txt-2);line-height:1.6;margin-bottom:24px;">' +
              'Открой апгрейдер через кнопку <b style="color:var(--gold);">🎰 Upgrader</b> в игре Artamon<br>' +
              'Или добавь <b>?nick=ТвойНик</b> в URL' +
            '</div>' +
            '<a href="index_v4.html" style="display:inline-block;padding:14px 28px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#0a0a0a;border-radius:12px;text-decoration:none;font-weight:900;">← Вернуться в игру</a>' +
          '</div>';
      }
      return;
    }

    // Полный рендер
    UI.renderAll();

    // Пинг
    var t0 = Date.now();
    fetch(API_URL + "/api/tech-status", { cache: "no-store" })
      .then(function() {
        var ping = Date.now() - t0;
        var pingEl = $("pingValue");
        if (pingEl) pingEl.textContent = ping + " мс";
      })
      .catch(function() {
        var pingEl = $("pingValue");
        if (pingEl) pingEl.textContent = "— мс";
      });

    console.log("[Upgrader] ✅ Инициализация завершена. Ник:", State.user.nick);
  }).catch(function(err) {
    console.error("[Upgrader] ❌ Ошибка:", err);
    toast("❌ Ошибка загрузки: " + err.message, "error");
  });
}

// ============================================================
// ЭКСПОРТ В WINDOW (нужно для inline onclick)
// ============================================================
window.UI = UI;
window.State = State;

// ============================================================
// СТАРТ
// ============================================================
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

console.log("%c🎰 Artamon Upgrader v5.0", "color:#d4af37;font-size:20px;font-weight:900;");
</script>

</body>
</html>
