name: Deploy Artamon API Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Artamon_2.9_worker_v29_ready.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker syntax
        run: node --check Artamon_2.9_worker_v29_ready.js

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy existing Artamon API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
